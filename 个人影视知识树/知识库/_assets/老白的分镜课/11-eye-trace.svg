<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">切镜前先预测眼睛会落在哪里</title><desc id="d">用顺接、故意跳跃和镜头时长三个示例解释视觉焦点与眼迹。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#dc2626"/></marker><style>.h{font:700 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#111827}.s{font:700 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#111827}.p{font:400 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#374151}.tiny{font:400 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#6b7280}.frame{fill:#f8fafc;stroke:#111827;stroke-width:3}</style></defs>
  <rect width="1200" height="760" fill="#f3f4f6"/><rect x="30" y="24" width="1140" height="712" rx="24" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <text x="70" y="78" class="h">切镜前先预测眼睛会落在哪里</text><text x="70" y="110" class="p">上一镜焦点位置＋运动惯性，决定切镜瞬间的预期落点；下镜重点靠近它则顺，远离它则冲击。</text>
  <text x="70" y="160" class="s">① 顺接：让下镜重点出现在眼睛预计到达的位置</text>
  <rect x="70" y="180" width="430" height="125" rx="12" class="frame"/><circle cx="170" cy="242" r="24" fill="#3b82f6"/><line x1="205" y1="242" x2="420" y2="242" stroke="#2563eb" stroke-width="6" marker-end="url(#a)"/><circle cx="420" cy="242" r="34" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 7"/>
  <line x1="520" y1="242" x2="665" y2="242" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="565" y="226" class="p">切镜</text>
  <rect x="690" y="180" width="440" height="125" rx="12" class="frame"/><circle cx="760" cy="242" r="34" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 7"/><circle cx="760" cy="242" r="24" fill="#10b981"/><text x="825" y="250" class="p">重点在预期落点附近，搜索成本低</text>
  <text x="70" y="355" class="s">② 冲击：先有稳定基准，再让焦点短暂跳远</text>
  <rect x="70" y="375" width="300" height="120" rx="12" class="frame"/><circle cx="170" cy="435" r="24" fill="#3b82f6"/><circle cx="170" cy="435" r="34" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="8 7"/><text x="220" y="442" class="p">稳定基准</text><line x1="385" y1="435" x2="455" y2="435" stroke="#dc2626" stroke-width="4" marker-end="url(#r)"/>
  <rect x="470" y="375" width="300" height="120" rx="12" class="frame"/><circle cx="690" cy="435" r="26" fill="#dc2626"/><circle cx="690" cy="435" r="38" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 7"/><text x="500" y="442" class="p">重点跳到远处：冲击</text><line x1="785" y1="435" x2="855" y2="435" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <rect x="870" y="375" width="260" height="120" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="900" y="420" class="p">下一镜重新建立</text><text x="900" y="455" class="p">重要信息与观看方向</text>
  <text x="70" y="545" class="s">③ 时长：读完第一焦点后，眼睛会主动寻找第二焦点</text>
  <rect x="70" y="565" width="1060" height="105" rx="12" class="frame"/><circle cx="250" cy="618" r="28" fill="#3b82f6"/><circle cx="250" cy="618" r="40" fill="none" stroke="#dc2626" stroke-width="4"/><text x="110" y="607" class="p">短停留</text><text x="110" y="637" class="p">第一焦点</text><line x1="300" y1="618" x2="650" y2="618" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#a)"/><circle cx="720" cy="618" r="22" fill="#f59e0b"/><text x="760" y="625" class="p">停留变长：第二焦点开始被搜索</text>
  <text x="70" y="720" class="tiny">教学示意：圆点与轨迹只表示注意力位置和趋势；不代表精密眼动数据、真实速度或固定停留时长。</text>
</svg>

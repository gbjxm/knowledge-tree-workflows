<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="t d">
  <title id="t">越轴必须写清：收益、损失、补偿、恢复</title><desc id="d">比较同侧剪接、直接越轴和带方向变化桥梁的越轴，并映射所用机位。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#dc2626"/></marker><style>.h{font:700 32px 'Microsoft YaHei',sans-serif;fill:#111827}.s{font:700 20px 'Microsoft YaHei',sans-serif;fill:#111827}.p{font:400 17px 'Microsoft YaHei',sans-serif;fill:#374151}.f{fill:#f8fafc;stroke:#111827;stroke-width:3}</style></defs>
  <rect width="1200" height="780" fill="#f3f4f6"/><rect x="30" y="24" width="1140" height="732" rx="24" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <text x="70" y="78" class="h">越轴必须写清：收益、损失、补偿、恢复</text><text x="70" y="110" class="p">先识别方向损失，再判断表达收益；没有补偿与恢复点的“故意越轴”仍是不完整设计。</text>
  <rect x="60" y="140" width="1080" height="250" rx="18" fill="#fff" stroke="#d1d5db" stroke-width="2"/><text x="88" y="180" class="s">① 俯视图</text>
  <rect x="90" y="205" width="1020" height="155" rx="14" fill="#eff6ff"/><rect x="90" y="205" width="1020" height="65" rx="14" fill="#fef2f2"/>
  <circle cx="380" cy="270" r="28" fill="#f59e0b"/><circle cx="820" cy="270" r="28" fill="#3b82f6"/><line x1="408" y1="270" x2="792" y2="270" stroke="#dc2626" stroke-width="4" stroke-dasharray="11 9"/><text x="430" y="250" class="p" fill="#b91c1c">关系轴 A—B</text>
  <rect x="310" y="320" width="52" height="30" rx="6" fill="#1d4ed8"/><path d="M362 327l18-7v30l-18-7z" fill="#1d4ed8"/><line x1="380" y1="335" x2="780" y2="290" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
  <rect x="838" y="320" width="52" height="30" rx="6" fill="#1d4ed8"/><path d="M838 327l-18-7v30l18-7z" fill="#1d4ed8"/><line x1="820" y1="335" x2="420" y2="290" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/>
  <rect x="570" y="215" width="52" height="30" rx="6" fill="#dc2626"/><path d="M584 245l-7 16h34l-7-16z" fill="#dc2626"/><line x1="594" y1="261" x2="780" y2="279" stroke="#dc2626" stroke-width="3" marker-end="url(#r)"/>
  <text x="245" y="352" class="p">C1 拍乙</text><text x="870" y="352" class="p">C2 拍甲</text><text x="640" y="238" class="p" fill="#b91c1c">CX 拍乙（越轴）</text>
  <text x="70" y="435" class="s">② 三种剪接结果</text>
  <g transform="translate(60 460)"><rect width="330" height="180" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="20" y="38" class="s">不越轴｜方向稳定</text><rect x="20" y="60" width="120" height="65" rx="8" class="f"/><text x="37" y="83" class="p">C2 拍甲</text><text x="49" y="113" class="s">甲 →</text><rect x="188" y="60" width="120" height="65" rx="8" class="f"/><text x="205" y="83" class="p">C1 拍乙</text><text x="218" y="113" class="s">← 乙</text><text x="20" y="158" class="p">双方像在互相看。</text></g>
  <g transform="translate(435 460)"><rect width="330" height="180" rx="16" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="20" y="38" class="s">直接越轴｜方向翻转</text><rect x="20" y="60" width="120" height="65" rx="8" class="f"/><text x="37" y="83" class="p">C2 拍甲</text><text x="49" y="113" class="s">甲 →</text><rect x="188" y="60" width="120" height="65" rx="8" class="f"/><text x="202" y="83" class="p">CX 拍乙</text><text x="218" y="113" class="s">乙 →</text><text x="20" y="158" class="p">可能突然像看同一方向。</text></g>
  <g transform="translate(810 460)"><rect width="330" height="180" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="20" y="38" class="s">有补偿｜让变化可见</text><rect x="18" y="60" width="82" height="65" rx="8" class="f"/><text x="30" y="82" class="p">C2拍甲</text><text x="38" y="112" class="s">甲→</text><rect x="124" y="60" width="82" height="65" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="138" y="88" class="p">转头</text><text x="138" y="113" class="p">/全景</text><rect x="230" y="60" width="82" height="65" rx="8" class="f"/><text x="239" y="82" class="p">CX拍乙</text><text x="250" y="112" class="s">乙→</text><text x="20" y="158" class="p">观众看见方向如何重建。</text></g>
  <rect x="60" y="665" width="1080" height="60" rx="14" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="88" y="703" class="p">越轴记录：具体收益｜定位损失｜补偿方式｜下一个重新建立方向的节点。</text>
  <text x="70" y="742" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#6b7280">教学示意：相机位置与人物距离不按比例；固定的是机位归属、屏幕方向与补偿逻辑。</text>
</svg>

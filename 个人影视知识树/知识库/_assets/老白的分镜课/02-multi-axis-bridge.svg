<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">换轴成功：把注意力转移拍出来</title><desc id="d">从甲乙旧关系经过乙转头桥梁切换到乙丙新关系。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><style>.h{font:700 32px 'Microsoft YaHei',sans-serif;fill:#111827}.s{font:700 21px 'Microsoft YaHei',sans-serif;fill:#111827}.p{font:400 17px 'Microsoft YaHei',sans-serif;fill:#374151}.b{fill:#fff;stroke:#d1d5db;stroke-width:2}.f{fill:#f8fafc;stroke:#111827;stroke-width:3}.old{stroke:#dc2626;stroke-width:4;stroke-dasharray:11 9}.new{stroke:#d97706;stroke-width:4;stroke-dasharray:11 9}</style></defs>
  <rect width="1200" height="760" fill="#f3f4f6"/><rect x="30" y="24" width="1140" height="712" rx="24" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <text x="70" y="78" class="h">换轴成功：把注意力转移拍出来</text><text x="70" y="110" class="p">旧关系 → 可见的转头／共同看向 → 新关系；换的不是几何线，而是当前注意力。</text>
  <rect x="60" y="140" width="520" height="390" rx="18" class="b"/><text x="88" y="180" class="s">① 俯视关系图</text>
  <line x1="180" y1="270" x2="455" y2="270" class="old"/><line x1="455" y1="270" x2="455" y2="445" class="new"/>
  <circle cx="180" cy="270" r="29" fill="#f59e0b" stroke="#92400e" stroke-width="3"/><circle cx="455" cy="270" r="29" fill="#3b82f6" stroke="#1e40af" stroke-width="3"/><circle cx="455" cy="445" r="29" fill="#10b981" stroke="#065f46" stroke-width="3"/>
  <text x="169" y="277" class="s" fill="#fff">A</text><text x="444" y="277" class="s" fill="#fff">B</text><text x="444" y="452" class="s" fill="#fff">C</text>
  <text x="230" y="250" class="p" fill="#b91c1c">旧轴：甲 ↔ 乙</text><text x="470" y="360" class="p" fill="#b45309">新轴：乙 ↔ 丙</text>
  <path d="M235 430 L430 308" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="195" y="428" width="52" height="31" rx="6" fill="#1d4ed8"/><text x="142" y="493" class="p">桥梁机位：同时看见乙转向丙</text>
  <rect x="610" y="140" width="530" height="390" rx="18" class="b"/><text x="638" y="180" class="s">② 三镜换轴链</text>
  <rect x="640" y="215" width="470" height="74" rx="10" class="f"/><text x="670" y="260" class="s">镜头 1　甲看乙　｜旧关系仍有效</text>
  <line x1="875" y1="298" x2="875" y2="328" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <rect x="640" y="335" width="470" height="92" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/><text x="670" y="375" class="s">桥梁　乙在画内转头看丙</text><text x="670" y="405" class="p">观众亲眼看见注意力从甲转给丙</text>
  <line x1="875" y1="437" x2="875" y2="467" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <rect x="640" y="474" width="470" height="45" rx="10" class="f"/><text x="670" y="505" class="s">镜头 3　丙回应乙　｜新关系成立</text>
  <rect x="60" y="555" width="1080" height="145" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="88" y="598" class="s">③ 判断标准</text><text x="88" y="634" class="p">桥梁可以是转头、共同看向、人物移动、关系全景或兼容两组关系的机位；它的作用是展示“关系接管”。</text><text x="88" y="668" class="p">不要一次画完所有人物连线。每个切点只问：上下两个镜头此刻究竟是谁在回应谁？</text>
  <text x="70" y="720" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#6b7280">教学示意：人物距离、相机坐标与画面比例不按真实场地缩放；固定的是关系接管与换轴逻辑。</text>
</svg>

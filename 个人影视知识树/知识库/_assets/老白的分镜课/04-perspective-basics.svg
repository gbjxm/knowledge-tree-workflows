<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d">
  <title id="t">景别相同，摄影机距离不同，透视仍会改变</title><desc id="d">用地平线校正同高人物，再比较近距大视角与远距小视角的空间差异。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><style>.h{font:700 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#111827}.s{font:700 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#111827}.p{font:400 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#374151}.tiny{font:400 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#6b7280}.panel{fill:#fff;stroke:#d1d5db;stroke-width:2}.frame{fill:#f8fafc;stroke:#111827;stroke-width:3}</style></defs>
  <rect width="1200" height="800" fill="#f3f4f6"/><rect x="30" y="24" width="1140" height="752" rx="24" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <text x="70" y="78" class="h">景别相同，摄影机距离不同，透视仍会改变</text><text x="70" y="110" class="p">地平线先校正同高人物；相机距离与视角再决定近大远小是被拉开还是被压缩。</text>
  <rect x="60" y="140" width="500" height="355" rx="18" class="panel"/><text x="88" y="180" class="s">① 地平线：统一同高人物的相对高度</text>
  <line x1="92" y1="295" x2="528" y2="295" stroke="#dc2626" stroke-width="4" stroke-dasharray="11 8"/><text x="105" y="280" class="p" fill="#b91c1c">地平线／相机眼高</text>
  <circle cx="180" cy="295" r="28" fill="#f59e0b"/><path d="M130 458 Q138 330 180 330 Q222 330 230 458Z" fill="#fbbf24"/><circle cx="330" cy="295" r="20" fill="#3b82f6"/><path d="M298 420 Q304 322 330 322 Q356 322 362 420Z" fill="#60a5fa"/><circle cx="455" cy="295" r="13" fill="#10b981"/><path d="M435 378 Q440 314 455 314 Q470 314 475 378Z" fill="#6ee7b7"/>
  <text x="120" y="478" class="p">近</text><text x="315" y="444" class="p">中</text><text x="443" y="402" class="p">远</text><text x="90" y="220" class="p">同一地面、同一身高：地平线穿过人物同一相对部位。</text>
  <rect x="590" y="140" width="550" height="355" rx="18" class="panel"/><text x="618" y="180" class="s">② 主体景别近似，背景关系仍不同</text>
  <rect x="620" y="215" width="230" height="220" rx="10" class="frame"/><text x="640" y="245" class="s">近距＋大视角</text><rect x="650" y="275" width="48" height="130" fill="#fde68a" stroke="#92400e" stroke-width="3"/><circle cx="770" cy="315" r="35" fill="#3b82f6"/><path d="M720 432 Q728 355 770 355 Q812 355 820 432Z" fill="#60a5fa"/><line x1="710" y1="420" x2="635" y2="270" stroke="#2563eb" stroke-width="2"/><line x1="830" y1="420" x2="850" y2="270" stroke="#2563eb" stroke-width="2"/>
  <rect x="880" y="215" width="230" height="220" rx="10" class="frame"/><text x="900" y="245" class="s">远距＋小视角</text><rect x="905" y="260" width="88" height="172" fill="#fde68a" stroke="#92400e" stroke-width="3"/><circle cx="1030" cy="315" r="35" fill="#3b82f6"/><path d="M980 432 Q988 355 1030 355 Q1072 355 1080 432Z" fill="#60a5fa"/><line x1="985" y1="420" x2="900" y2="270" stroke="#2563eb" stroke-width="2"/><line x1="1080" y1="420" x2="1110" y2="270" stroke="#2563eb" stroke-width="2"/>
  <text x="640" y="470" class="p">深度拉开，背景显小</text><text x="900" y="470" class="p">深度压缩，背景显大</text>
  <rect x="60" y="525" width="1080" height="190" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="88" y="565" class="s">③ 推拉变焦：主体大小近似，背景透视持续变化</text>
  <rect x="88" y="595" width="220" height="70" rx="10" fill="#fff" stroke="#111827" stroke-width="2"/><text x="118" y="638" class="p">相机移动：改变距离</text><line x1="318" y1="630" x2="380" y2="630" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="390" y="595" width="220" height="70" rx="10" fill="#fff" stroke="#111827" stroke-width="2"/><text x="420" y="638" class="p">反向改变视角／焦距</text><line x1="620" y1="630" x2="682" y2="630" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="692" y="595" width="190" height="70" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="730" y="638" class="p">主体大小近似</text><line x1="892" y1="630" x2="954" y2="630" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="964" y="595" width="150" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="982" y="638" class="p">背景发生形变</text>
  <text x="70" y="758" class="tiny">教学示意：人物、背景与视角未按真实镜头参数精密计算；固定的是地平线关系与距离—视角组合的变化方向。</text>
</svg>

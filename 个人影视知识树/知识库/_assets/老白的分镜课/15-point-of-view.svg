<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">视角不是一颗主观镜头，而是反应—所见链</title><desc id="d">比较客观镜头链、小红反应—所见链和小蓝反应—所见链。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><style>.h{font:700 32px 'Microsoft YaHei',sans-serif;fill:#111827}.s{font:700 20px 'Microsoft YaHei',sans-serif;fill:#111827}.p{font:400 17px 'Microsoft YaHei',sans-serif;fill:#374151}.card{fill:#f8fafc;stroke:#111827;stroke-width:2}</style></defs>
  <rect width="1200" height="760" fill="#f3f4f6"/><rect x="30" y="24" width="1140" height="712" rx="24" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <text x="70" y="78" class="h">视角不是一颗主观镜头，而是反应—所见链</text><text x="70" y="110" class="p">连续两到三次把反应与所见归给同一角色，观众才会进入他的认知位置。</text>
  <text x="70" y="165" class="s">① 客观版｜不把认知链固定给任何一人</text>
  <g transform="translate(70 185)"><rect width="220" height="80" rx="12" class="card"/><text x="58" y="48" class="s">双人全景</text><line x1="230" y1="40" x2="285" y2="40" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="300" width="220" height="80" rx="12" class="card"/><text x="364" y="48" class="s">小红说话</text><line x1="530" y1="40" x2="585" y2="40" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="600" width="220" height="80" rx="12" class="card"/><text x="664" y="48" class="s">小蓝回答</text><line x1="830" y1="40" x2="885" y2="40" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="900" width="220" height="80" rx="12" class="card"/><text x="964" y="48" class="s">小蓝离开</text></g>
  <rect x="60" y="300" width="1080" height="175" rx="18" fill="#fef2f2" stroke="#f87171" stroke-width="2"/><text x="88" y="340" class="s" fill="#b91c1c">② 小红视角版｜等待与被冷落</text>
  <g transform="translate(88 365)"><rect width="210" height="72" rx="12" class="card"/><text x="42" y="44" class="s">小红等待</text><line x1="218" y1="36" x2="260" y2="36" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="270" width="250" height="72" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="302" y="44" class="s">她看见：空门口</text><line x1="528" y1="36" x2="570" y2="36" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="580" width="210" height="72" rx="12" class="card"/><text x="625" y="44" class="s">小蓝进入</text><line x1="798" y1="36" x2="840" y2="36" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="850" width="210" height="72" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/><text x="898" y="44" class="s">小红失落</text></g>
  <rect x="60" y="500" width="1080" height="175" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/><text x="88" y="540" class="s" fill="#1d4ed8">③ 小蓝视角版｜警惕与回避</text>
  <g transform="translate(88 565)"><rect width="210" height="72" rx="12" class="card"/><text x="50" y="44" class="s">小蓝进门</text><line x1="218" y1="36" x2="260" y2="36" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="270" width="250" height="72" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="290" y="44" class="s">他看见：异常饭菜</text><line x1="528" y1="36" x2="570" y2="36" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="580" width="210" height="72" rx="12" class="card"/><text x="628" y="44" class="s">小蓝警惕</text><line x1="798" y1="36" x2="840" y2="36" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="850" width="210" height="72" rx="12" fill="#fff" stroke="#2563eb" stroke-width="2"/><text x="898" y="44" class="s">选择离开</text></g>
  <text x="70" y="696" class="p">事件没有改变；改变的是信息先后、反应归属和观众对人物动机的推断。</text>
  <text x="70" y="722" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#6b7280">教学示意：镜头数量用于展示信息归属，不代表最终剪辑必须采用相同镜数与时长。</text>
</svg>

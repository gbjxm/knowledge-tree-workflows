<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">机位图只给候选，故事任务决定保留什么</title><desc id="d">从三人方位图推出四个候选机位，再按新增信息筛选，并选择切镜或运镜连接。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><style>.h{font:700 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#111827}.s{font:700 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#111827}.p{font:400 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#374151}.tiny{font:400 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#6b7280}.panel{fill:#fff;stroke:#d1d5db;stroke-width:2}.card{fill:#f8fafc;stroke:#111827;stroke-width:2}</style></defs>
  <rect width="1200" height="760" fill="#f3f4f6"/><rect x="30" y="24" width="1140" height="712" rx="24" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <text x="70" y="78" class="h">机位图只给候选，故事任务决定保留什么</text><text x="70" y="110" class="p">方位图 → 候选机位 → 新增信息筛选 → 切镜或运镜连接；符合轴线不等于镜头有用。</text>
  <rect x="60" y="140" width="440" height="365" rx="18" class="panel"/><text x="88" y="180" class="s">① 俯视图：先获得安全候选</text>
  <circle cx="280" cy="245" r="27" fill="#f59e0b"/><text x="271" y="252" class="s" fill="#fff">A</text><circle cx="180" cy="365" r="25" fill="#3b82f6"/><text x="171" y="372" class="s" fill="#fff">B</text><circle cx="380" cy="365" r="25" fill="#10b981"/><text x="371" y="372" class="s" fill="#fff">C</text>
  <line x1="270" y1="272" x2="195" y2="342" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 7"/><line x1="290" y1="272" x2="365" y2="342" stroke="#dc2626" stroke-width="3" stroke-dasharray="9 7"/>
  <line x1="153" y1="437" x2="173" y2="398" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><line x1="268" y1="452" x2="280" y2="285" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><line x1="383" y1="452" x2="380" y2="400" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/><line x1="415" y1="437" x2="214" y2="385" stroke="#2563eb" stroke-width="2" marker-end="url(#a)"/>
  <g fill="#1d4ed8"><rect x="92" y="430" width="46" height="28" rx="5"/><rect x="207" y="445" width="46" height="28" rx="5"/><rect x="322" y="445" width="46" height="28" rx="5"/><rect x="430" y="430" width="46" height="28" rx="5"/></g>
  <path d="M138 437l15-7v28l-15-7zM253 452l15-7v28l-15-7zM368 452l15-7v28l-15-7zM430 437l-15-7v28l15-7z" fill="#1d4ed8"/>
  <text x="94" y="488" class="p">C1</text><text x="209" y="488" class="p">C2</text><text x="324" y="488" class="p">C3</text><text x="432" y="488" class="p">C4</text>
  <rect x="530" y="140" width="610" height="365" rx="18" class="panel"/><text x="558" y="180" class="s">② 候选画面：逐个写“新增了什么”</text>
  <g transform="translate(558 210)"><rect width="255" height="105" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="18" y="34" class="s">C1｜建立全体关系</text><text x="18" y="68" class="p">新增：谁面对谁、空间基准</text><text x="18" y="94" class="p" fill="#047857">保留</text></g>
  <g transform="translate(842 210)"><rect width="270" height="105" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="18" y="34" class="s">C2｜看见 A 的反应</text><text x="18" y="68" class="p">新增：表演与情绪变化</text><text x="18" y="94" class="p" fill="#047857">保留</text></g>
  <g transform="translate(558 340)"><rect width="255" height="105" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="18" y="34" class="s">C3｜B 与 C 局部互动</text><text x="18" y="68" class="p">新增：新关系与新轴</text><text x="18" y="94" class="p" fill="#047857">保留</text></g>
  <g transform="translate(842 340)"><rect width="270" height="105" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/><text x="18" y="34" class="s">C4｜只换角度</text><text x="18" y="68" class="p">新增：无；信息与情绪重复</text><text x="18" y="94" class="p" fill="#b91c1c">删除或重设计</text></g>
  <rect x="60" y="535" width="1080" height="150" rx="18" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/><text x="88" y="575" class="s">③ 人物移动后重新建轴，再决定切镜还是运镜</text>
  <rect x="88" y="600" width="190" height="52" rx="9" class="card"/><text x="118" y="633" class="p">方位与当前关系</text><line x1="288" y1="626" x2="350" y2="626" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="360" y="600" width="190" height="52" rx="9" class="card"/><text x="392" y="633" class="p">候选是否新增信息</text><line x1="560" y1="626" x2="622" y2="626" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="632" y="600" width="190" height="52" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="680" y="633" class="p">保留有效机位</text><line x1="832" y1="626" x2="894" y2="626" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><rect x="904" y="600" width="205" height="52" rx="9" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="932" y="633" class="p">切镜／运镜连接阶段</text>
  <text x="70" y="720" class="tiny">教学示意：人物、轴线与候选机位不复刻案例真实场地；固定的是“候选—任务—筛选—连接”的循环。</text>
</svg>

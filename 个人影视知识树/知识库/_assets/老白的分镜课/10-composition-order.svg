<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">构图不是套模板，而是整理既有元素</title><desc id="d">比较抽象形状启发与既有元素有序排布，并展示层次、疏密、带状组织和视觉焦点四个抓手。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><style>.h{font:700 32px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#111827}.s{font:700 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#111827}.p{font:400 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#374151}.tiny{font:400 14px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#6b7280}.panel{fill:#fff;stroke:#d1d5db;stroke-width:2}.frame{fill:#f8fafc;stroke:#111827;stroke-width:3}</style></defs>
  <rect width="1200" height="760" fill="#f3f4f6"/><rect x="30" y="24" width="1140" height="712" rx="24" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <text x="70" y="78" class="h">构图不是套模板，而是整理既有元素</text><text x="70" y="110" class="p">抽象形状用于启发；真实分镜要把人物、家具与空间组织成可读、可动、可衔接的秩序。</text>
  <rect x="60" y="145" width="500" height="380" rx="18" class="panel"/><text x="88" y="185" class="s">① 抽象形状：启发，不是硬规则</text>
  <rect x="92" y="220" width="436" height="250" rx="10" class="frame"/><line x1="237" y1="220" x2="237" y2="470" stroke="#9ca3af" stroke-width="2"/><line x1="382" y1="220" x2="382" y2="470" stroke="#9ca3af" stroke-width="2"/><line x1="92" y1="303" x2="528" y2="303" stroke="#9ca3af" stroke-width="2"/><line x1="92" y1="387" x2="528" y2="387" stroke="#9ca3af" stroke-width="2"/>
  <path d="M125 430 C170 230 445 235 485 420" fill="none" stroke="#f59e0b" stroke-width="5"/><circle cx="237" cy="303" r="22" fill="#3b82f6"/><path d="M237 325v70M237 345l-30 28M237 345l30 28" stroke="#1e40af" stroke-width="6"/><path d="M270 303 C335 305 390 340 455 365" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#a)"/>
  <text x="105" y="500" class="p">人物一移动，就可能离开三分点或抽象曲线。</text>
  <rect x="590" y="145" width="550" height="380" rx="18" class="panel"/><text x="618" y="185" class="s">② 既有元素：按叙事任务重新排布</text>
  <rect x="620" y="220" width="490" height="250" rx="10" class="frame"/><path d="M630 460 L720 240 L1090 240 L1090 460Z" fill="#e5e7eb"/><path d="M635 460 L720 240 L720 460Z" fill="#dbeafe"/><path d="M655 460 Q665 300 750 285 Q815 330 835 460Z" fill="#6b7280" fill-opacity=".72"/><circle cx="900" cy="325" r="30" fill="#3b82f6"/><path d="M855 460 Q862 360 900 360 Q938 360 945 460Z" fill="#60a5fa"/><rect x="1025" y="270" width="58" height="125" fill="#fde68a" stroke="#92400e" stroke-width="3"/><circle cx="900" cy="325" r="43" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="8 7"/><path d="M680 410 Q790 300 855 325" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <text x="640" y="500" class="p">前景成带｜中景主体｜远景目标｜引导线接住焦点</text>
  <rect x="60" y="555" width="1080" height="130" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="88" y="595" class="s">③ 四个实用抓手</text>
  <rect x="88" y="615" width="235" height="45" rx="9" fill="#fff" stroke="#3b82f6" stroke-width="2"/><text x="145" y="644" class="p">层次：建立空间</text><rect x="343" y="615" width="235" height="45" rx="9" fill="#fff" stroke="#3b82f6" stroke-width="2"/><text x="400" y="644" class="p">疏密：制造对比</text><rect x="598" y="615" width="235" height="45" rx="9" fill="#fff" stroke="#3b82f6" stroke-width="2"/><text x="655" y="644" class="p">带状：降低杂乱</text><rect x="853" y="615" width="257" height="45" rx="9" fill="#fff" stroke="#3b82f6" stroke-width="2"/><text x="905" y="644" class="p">焦点：控制眼迹</text>
  <text x="70" y="720" class="tiny">教学示意：几何网格与场景元素均为简化模型；固定的是“形状启发”和“有序排布”的不同职责。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="t d">
  <title id="t">先定画面，再反推机位和关系轴</title><desc id="d">先确定目标画框，再还原主体、道具、关系轴和桥梁机位。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><style>.h{font:700 32px 'Microsoft YaHei',sans-serif;fill:#111827}.s{font:700 21px 'Microsoft YaHei',sans-serif;fill:#111827}.p{font:400 17px 'Microsoft YaHei',sans-serif;fill:#374151}.b{fill:#fff;stroke:#d1d5db;stroke-width:2}.f{fill:#f8fafc;stroke:#111827;stroke-width:3}</style></defs>
  <rect width="1200" height="760" fill="#f3f4f6"/><rect x="30" y="24" width="1140" height="712" rx="24" fill="#fff" stroke="#d1d5db" stroke-width="2"/>
  <text x="70" y="78" class="h">先定画面，再反推机位和关系轴</text><text x="70" y="110" class="p">目标画框先规定观众必须看见什么；人物、道具、轴线与机位随后为它服务。</text>
  <rect x="60" y="140" width="520" height="390" rx="18" class="b"/><text x="88" y="180" class="s">① 目标画框</text>
  <rect x="90" y="215" width="460" height="255" rx="10" class="f"/><path d="M105 466 Q110 290 220 275 Q280 315 292 470Z" fill="#f59e0b" fill-opacity=".75"/><circle cx="380" cy="315" r="36" fill="#3b82f6"/><path d="M342 360h76l42 110H300Z" fill="#60a5fa"/><path d="M420 360 L470 420" stroke="#1e40af" stroke-width="9"/><path d="M470 420l35-28 18 46-38 28z" fill="#92400e"/><text x="112" y="245" class="p">甲肩（旧关系）</text><text x="328" y="250" class="p">乙看向吉他（新关系）</text><text x="110" y="510" class="p">画框同时保留：甲—乙旧关系＋乙—吉他注意转移</text>
  <rect x="610" y="140" width="530" height="390" rx="18" class="b"/><text x="638" y="180" class="s">② 还原俯视摆位</text>
  <circle cx="730" cy="280" r="28" fill="#f59e0b"/><circle cx="970" cy="280" r="28" fill="#3b82f6"/><rect x="948" y="430" width="45" height="30" rx="5" fill="#92400e" transform="rotate(-20 970 445)"/>
  <line x1="758" y1="280" x2="942" y2="280" stroke="#dc2626" stroke-width="4" stroke-dasharray="10 8"/><line x1="970" y1="310" x2="970" y2="415" stroke="#d97706" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="785" y="260" class="p">旧轴：甲—乙</text><text x="985" y="370" class="p">新轴：乙—吉他</text>
  <rect x="820" y="440" width="54" height="32" rx="6" fill="#1d4ed8"/><path d="M847 438 L850 392" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/><text x="704" y="500" class="p">桥梁机位：让乙的转看和吉他位置同镜出现</text>
  <rect x="60" y="555" width="1080" height="145" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/><text x="88" y="596" class="s">③ 反推清单</text><text x="88" y="632" class="p">画框里谁是主体？他在看谁或什么？哪些前景说明旧关系？新目标在空间哪里？这个机位属于哪条轴？</text><text x="88" y="667" class="p">若相邻主镜没有共同关系，再补桥梁；不要先列机位编号，再勉强把故事塞进去。</text>
  <text x="70" y="720" font-family="Microsoft YaHei,Noto Sans CJK SC,sans-serif" font-size="14" fill="#6b7280">教学示意：主体位置与机位距离不按比例；固定的是旧关系、新关系与桥梁画面的对应。</text>
</svg>

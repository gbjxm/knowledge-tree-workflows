<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">常规建制与四种调序开场决策树</title>
  <desc id="desc">先检查常规建制中的世界、人物、现状和代表性场面是否有力；若不足，再从激励事件、前史、结局或大悬念、中段代表场面中选择，并在后续补回建制。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .subtitle{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .section{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .label{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .body{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}
      .small{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}
      .white{font:700 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#ffffff}
      .core{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1e3a8a}
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="880" fill="#f1f5f9"/>
  <rect x="28" y="20" width="1144" height="840" rx="8" class="card"/>
  <text x="60" y="68" class="title">第18课｜拿人的开场怎样选择</text>
  <text x="60" y="99" class="subtitle">“拿人／不拿人”描述观看效果；“常规／非常规”描述叙事顺序，两组概念不要混用</text>
  <rect x="60" y="120" width="1080" height="48" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="600" y="151" text-anchor="middle" class="core">先把常规建制写强；只有它缺少亮点时，才从后文借一段更有价值的材料</text>

  <rect x="388" y="194" width="424" height="84" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="600" y="226" text-anchor="middle" class="section">常规建制本身有力吗？</text>
  <text x="600" y="254" text-anchor="middle" class="body">世界｜人物｜现状｜代表性建制戏</text>

  <line x1="388" y1="236" x2="206" y2="236" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="290" y="222" text-anchor="middle" class="label">有</text>
  <rect x="70" y="194" width="126" height="84" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="133" y="226" text-anchor="middle" class="label">常规开场</text>
  <text x="133" y="252" text-anchor="middle" class="body">保留顺序</text>

  <line x1="600" y1="278" x2="600" y2="324" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text x="620" y="307" class="label">不足</text>
  <rect x="384" y="330" width="432" height="64" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="600" y="358" text-anchor="middle" class="label">非常规调序：从后文选择一段前置</text>
  <text x="600" y="381" text-anchor="middle" class="small">选择标准不是“最热闹”，而是“有观看价值且属于这部作品”</text>

  <line x1="600" y1="394" x2="600" y2="424" stroke="#2563eb" stroke-width="3"/>
  <line x1="194" y1="424" x2="1006" y2="424" stroke="#2563eb" stroke-width="3"/>
  <line x1="194" y1="424" x2="194" y2="448" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="464" y1="424" x2="464" y2="448" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="736" y1="424" x2="736" y2="448" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="1006" y1="424" x2="1006" y2="448" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <rect x="60" y="456" width="258" height="178" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="78" y="474" width="36" height="28" rx="8" fill="#2563eb"/><text x="96" y="494" text-anchor="middle" class="white">1</text>
  <text x="126" y="495" class="label">激励事件提前</text>
  <text x="82" y="530" class="body">选：事件本身够强，</text><text x="82" y="554" class="body">且离常规开头不远</text>
  <text x="82" y="586" class="small">补回：人物现状、事件意义、</text><text x="82" y="608" class="small">必要世界规则</text>

  <rect x="330" y="456" width="258" height="178" rx="8" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
  <rect x="348" y="474" width="36" height="28" rx="8" fill="#0f766e"/><text x="366" y="494" text-anchor="middle" class="white">2</text>
  <text x="396" y="495" class="label">前史开场</text>
  <text x="352" y="530" class="body">选：过去造成当前缺口，</text><text x="352" y="554" class="body">并会在后文持续回响</text>
  <text x="352" y="586" class="small">补回：成年现状、当下欲望、</text><text x="352" y="608" class="small">前史与行动的连接</text>

  <rect x="600" y="456" width="270" height="178" rx="8" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <rect x="618" y="474" width="36" height="28" rx="8" fill="#7c3aed"/><text x="636" y="494" text-anchor="middle" class="white">3</text>
  <text x="666" y="495" class="label">结局／大悬念提前</text>
  <text x="622" y="530" class="body">选：结果够强，且“如何</text><text x="622" y="554" class="body">到达”仍有观看价值</text>
  <text x="622" y="586" class="small">补回：身份、因果、过程与</text><text x="622" y="608" class="small">结果的真实含义</text>

  <rect x="882" y="456" width="258" height="178" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <rect x="900" y="474" width="36" height="28" rx="8" fill="#dc2626"/><text x="918" y="494" text-anchor="middle" class="white">4</text>
  <text x="948" y="495" class="label">中段代表场面</text>
  <text x="904" y="530" class="body">选：代表主题、价值、</text><text x="904" y="554" class="body">色调或核心关系</text>
  <text x="904" y="586" class="small">补回：正文起点、时间跳转、</text><text x="904" y="608" class="small">该场面在整体中的位置</text>

  <line x1="600" y1="634" x2="600" y2="680" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="196" y="686" width="808" height="98" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
  <text x="600" y="716" text-anchor="middle" class="section">调序后验收</text>
  <text x="600" y="746" text-anchor="middle" class="body">前置片段有观看价值　＋　代表整体承诺　＋　后续及时补回世界、人物、现状与因果</text>
  <text x="600" y="772" text-anchor="middle" class="small">三项缺一，回到常规建制或重写场面；不能只把热闹镜头贴在开头</text>

  <rect x="60" y="806" width="1080" height="34" rx="8" fill="#fefce8" stroke="#fde047"/>
  <text x="600" y="829" text-anchor="middle" class="small">适用边界：“能改”不等于“应改”；平静、写实或观察式开场也可能是最准确的作品选择。</text>
</svg>

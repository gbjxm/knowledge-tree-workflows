<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">第九课：围绕主角组织人物系统</title>
  <desc id="desc">主角通过持续决定推动故事。共情、配角、人物关系和人物弧光四个系统围绕主角协作，并分别提供观众跟随、事件功能、作用力和变化轨迹。</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#0f766e"/></marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .subtitle{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .section{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .module{font:700 20px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .body{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}
      .strong{font:700 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .small{font:400 15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}
      .badge{font:700 15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#ffffff}
    </style>
  </defs>

  <rect width="1200" height="880" fill="#f1f5f9"/>
  <rect x="28" y="20" width="1144" height="840" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="70" class="title">第九课：围绕主角组织人物系统</text>
  <text x="60" y="101" class="subtitle">先确认谁持续作决定，再让共情、配角、关系与弧光各司其职</text>

  <line x1="440" y1="302" x2="500" y2="382" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="760" y1="302" x2="700" y2="382" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="440" y1="620" x2="500" y2="500" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <line x1="760" y1="620" x2="700" y2="500" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-teal)"/>

  <rect x="60" y="142" width="380" height="236" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="82" y="164" width="34" height="28" rx="8" fill="#2563eb"/><text x="92" y="184" class="badge">1</text>
  <text x="130" y="185" class="module">三面共情：让观众愿意跟随</text>
  <text x="84" y="226" class="strong">身份面</text><text x="168" y="226" class="body">可怜 · 可信 · 可爱</text>
  <text x="84" y="264" class="strong">欲望面</text><text x="168" y="264" class="body">下钻到原始需要</text>
  <text x="84" y="302" class="strong">动作面</text><text x="168" y="302" class="body">重大行动先取得观众许可</text>
  <text x="84" y="345" class="small">共情是理解处境与愿望，不等于认同全部行为</text>

  <rect x="760" y="142" width="380" height="236" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <rect x="782" y="164" width="34" height="28" rx="8" fill="#d97706"/><text x="792" y="184" class="badge">2</text>
  <text x="830" y="185" class="module">配角三步：从事件功能产生</text>
  <rect x="786" y="216" width="98" height="64" rx="8" fill="#ffffff" stroke="#d97706"/><text x="800" y="244" class="strong">按事产生</text><text x="800" y="268" class="small">先写功能</text>
  <rect x="902" y="216" width="98" height="64" rx="8" fill="#ffffff" stroke="#d97706"/><text x="916" y="244" class="strong">合并同类</text><text x="916" y="268" class="small">删冗余人</text>
  <rect x="1018" y="216" width="98" height="64" rx="8" fill="#ffffff" stroke="#d97706"/><text x="1032" y="244" class="strong">加强记忆</text><text x="1032" y="268" class="small">行动反差</text>
  <text x="786" y="320" class="body">配角的价值：推动、阻碍、映照或改变主行动线</text>
  <text x="786" y="349" class="small">不是先堆人物表，再为每个人硬找戏</text>

  <rect x="470" y="342" width="260" height="190" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="3"/>
  <rect x="500" y="366" width="54" height="30" rx="8" fill="#0f766e"/><text x="516" y="387" class="badge">中心</text>
  <text x="500" y="430" class="section">主角</text>
  <text x="500" y="465" class="strong">持续作出决定</text>
  <text x="500" y="496" class="strong">并推动故事的人</text>
  <text x="500" y="521" class="small">戏份最多 ≠ 主角</text>

  <rect x="60" y="510" width="380" height="246" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="82" y="532" width="34" height="28" rx="8" fill="#7c3aed"/><text x="92" y="552" class="badge">3</text>
  <text x="130" y="553" class="module">人物关系：记录作用力</text>
  <text x="84" y="594" class="strong">社会关系</text><text x="186" y="594" class="body">谁与谁是什么身份</text>
  <text x="84" y="632" class="strong">当前作用</text><text x="186" y="632" class="body">推动 / 阻碍主行动线</text>
  <text x="84" y="670" class="strong">具体行为</text><text x="186" y="670" class="body">用哪件事施加力量</text>
  <text x="84" y="708" class="strong">反转事件</text><text x="186" y="708" class="body">何时从推力变阻力</text>
  <text x="84" y="740" class="small">关系图不只标亲属或同事，还要标叙事方向</text>

  <rect x="760" y="510" width="380" height="246" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <rect x="782" y="532" width="34" height="28" rx="8" fill="#15803d"/><text x="792" y="552" class="badge">4</text>
  <text x="830" y="553" class="module">人物弧光：让变化有层次</text>
  <line x1="800" y1="640" x2="1098" y2="640" stroke="#15803d" stroke-width="3" marker-end="url(#arrow-teal)"/>
  <circle cx="814" cy="640" r="15" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="814" y="646" text-anchor="middle" class="body">起</text>
  <circle cx="886" cy="640" r="15" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="886" y="646" text-anchor="middle" class="body">选</text>
  <circle cx="958" cy="640" r="15" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="958" y="646" text-anchor="middle" class="body">价</text>
  <circle cx="1030" cy="640" r="15" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="1030" y="646" text-anchor="middle" class="body">新</text>
  <circle cx="1098" cy="640" r="15" fill="#ffffff" stroke="#15803d" stroke-width="2"/><text x="1098" y="646" text-anchor="middle" class="body">终</text>
  <text x="790" y="596" class="body">起点 → 选择 → 代价 → 新状态 → 终点</text>
  <text x="790" y="692" class="body">每次选择都让下一次选择更难或更真实</text>
  <text x="790" y="729" class="small">弧光是渐变链，不是一句“他成长了”</text>

  <rect x="60" y="790" width="1080" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="84" y="819" class="body">适用边界：有些类型会让人物保持稳定；即使如此，也必须清楚他如何决定、推动事件并影响他人。</text>
</svg>

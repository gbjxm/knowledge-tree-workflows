<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">第十课：用四轴还原复杂叙事</title>
  <desc id="desc">先从人物、事件、视角和时间四个轴还原复杂作品，再区分复合型主角、团队主角和真正双主角。人物多、倒叙和快速切换都不自动等于复杂叙事。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .subtitle{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .section{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .module{font:700 20px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .body{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}
      .strong{font:700 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .small{font:400 15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}
      .badge{font:700 15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#ffffff}
    </style>
  </defs>

  <rect width="1200" height="860" fill="#f1f5f9"/>
  <rect x="28" y="20" width="1144" height="820" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="70" class="title">第十课：用四轴还原复杂叙事</text>
  <text x="60" y="101" class="subtitle">先找到简单内核，再判断作品究竟增加了哪一种叙事任务</text>

  <text x="60" y="144" class="section">1　四轴还原：分别回答四个问题</text>
  <rect x="60" y="166" width="255" height="184" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <rect x="82" y="188" width="34" height="28" rx="8" fill="#2563eb"/><text x="92" y="208" class="badge">1</text>
  <text x="130" y="209" class="module">人物轴</text>
  <text x="84" y="251" class="body">谁持续决定并承担后果？</text>
  <text x="84" y="282" class="body">有几套独立目标与弧线？</text>
  <text x="84" y="322" class="small">角色多 ≠ 主角多</text>

  <rect x="335" y="166" width="255" height="184" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <rect x="357" y="188" width="34" height="28" rx="8" fill="#d97706"/><text x="367" y="208" class="badge">2</text>
  <text x="405" y="209" class="module">事件轴</text>
  <text x="359" y="251" class="body">所有支线围绕哪件大事？</text>
  <text x="359" y="282" class="body">阻力是独立故事还是扩张？</text>
  <text x="359" y="322" class="small">多线外观可来自单线内核</text>

  <rect x="610" y="166" width="255" height="184" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <rect x="632" y="188" width="34" height="28" rx="8" fill="#0f766e"/><text x="642" y="208" class="badge">3</text>
  <text x="680" y="209" class="module">视角轴</text>
  <text x="634" y="251" class="body">观众最希望谁成功？</text>
  <text x="634" y="282" class="body">观众比谁知道得更多？</text>
  <text x="634" y="322" class="small">全知快感会分散单人共情</text>

  <rect x="885" y="166" width="255" height="184" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <rect x="907" y="188" width="34" height="28" rx="8" fill="#7c3aed"/><text x="917" y="208" class="badge">4</text>
  <text x="955" y="209" class="module">时间轴</text>
  <text x="909" y="251" class="body">因果本身是否被打散？</text>
  <text x="909" y="282" class="body">还是只调整成片顺序？</text>
  <text x="909" y="322" class="small">倒叙 ≠ 自动非线性</text>

  <path d="M187 350V372H1013V350M462 350V372M737 350V372M600 372V394" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="250" y="404" width="700" height="64" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="3"/>
  <text x="600" y="445" text-anchor="middle" class="section">先化繁为简：主角 + 核心事件 + 主要视角 + 时间因果</text>

  <text x="60" y="514" class="section">2　主角类型判别：看独立任务，不看演员数量</text>
  <rect x="60" y="538" width="340" height="188" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="84" y="574" class="module">复合型主角</text>
  <text x="84" y="610" class="body">多人共享一个核心目标、事件</text>
  <text x="84" y="640" class="body">主要视角与整体成长</text>
  <text x="84" y="682" class="strong">检查：合并成一人后，主线仍成立</text>
  <text x="84" y="711" class="small">性格或能力拆分，不等于独立主线</text>

  <rect x="430" y="538" width="340" height="188" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="454" y="574" class="module">团队主角</text>
  <text x="454" y="610" class="body">观众与团队整体共情</text>
  <text x="454" y="640" class="body">共同任务 + 内部冲突</text>
  <text x="454" y="682" class="strong">检查：团队能否停止内耗并完成任务</text>
  <text x="454" y="711" class="small">成员小变化不必都成完整弧线</text>

  <rect x="800" y="538" width="340" height="188" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="824" y="574" class="module">真正双主角</text>
  <text x="824" y="610" class="body">各自拥有目标、激励与选择链</text>
  <text x="824" y="640" class="body">专属代价、结果与人物弧线</text>
  <text x="824" y="682" class="strong">检查：共享场面承担不同结构功能</text>
  <text x="824" y="711" class="small">两条弧线可共用一件大事</text>

  <rect x="60" y="756" width="1080" height="54" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="84" y="790" class="body">复杂外观可由阻力扩张、横向连接和信息差生成；巧合可促成相遇，但不能替代人物选择与最终解决。</text>
  <text x="1140" y="832" text-anchor="end" class="small">适用边界：四轴是还原与诊断工具，不是给作品贴上“复杂”标签的评分表</text>
</svg>

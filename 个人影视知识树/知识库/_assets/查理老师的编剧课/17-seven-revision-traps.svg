<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">七类新手问题的返修顺序</title>
  <desc id="desc">七层诊断漏斗从材料的公共可读性进入，依次修复苦难姿态、主角行动、对手、铺垫、事件流动和情绪配比。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .subtitle{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .section{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .issue{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .body{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}
      .small{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}
      .number{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#ffffff}
      .core{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1e3a8a}
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#f1f5f9"/>
  <rect x="28" y="20" width="1144" height="860" rx="8" class="card"/>
  <text x="60" y="68" class="title">第17课｜七类新手问题的返修顺序</text>
  <text x="60" y="99" class="subtitle">从“陌生观众能否进入”一路查到“整部作品是否有体验变化”，避免只润色局部台词</text>
  <rect x="60" y="120" width="1080" height="48" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="600" y="151" text-anchor="middle" class="core">先修入口与人物，再修冲突与推进，最后修观众体验</text>

  <text x="98" y="205" class="section">诊断漏斗</text>
  <text x="1102" y="205" text-anchor="end" class="small">每层都先问诊断问题，再执行一个首要修改动作</text>

  <path d="M70 224 H1130 L1090 298 H110 Z" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <circle cx="142" cy="261" r="22" fill="#d97706"/><text x="142" y="268" text-anchor="middle" class="number">1</text>
  <text x="184" y="254" class="issue">选材过度自我</text><text x="184" y="280" class="body">陌生观众看不懂为何有趣？→ 补足片内可见的关系前提与事件价值</text>

  <path d="M110 310 H1090 L1050 384 H150 Z" fill="#fefce8" stroke="#ca8a04" stroke-width="2"/>
  <circle cx="180" cy="347" r="22" fill="#ca8a04"/><text x="180" y="354" text-anchor="middle" class="number">2</text>
  <text x="222" y="340" class="issue">苦难等于艺术</text><text x="222" y="366" class="body">主角只在受害、没有出口？→ 增加欲望、选择、行动、希望或救赎路径</text>

  <path d="M150 396 H1050 L1010 470 H190 Z" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <circle cx="220" cy="433" r="22" fill="#dc2626"/><text x="220" y="440" text-anchor="middle" class="number">3</text>
  <text x="262" y="426" class="issue">主角失去共情与行动</text><text x="262" y="452" class="body">目标莫名、性格抽象、高潮靠外援？→ 用行为立人，让主角亲手解决核心问题</text>

  <path d="M190 482 H1010 L970 556 H230 Z" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="260" cy="519" r="22" fill="#7c3aed"/><text x="260" y="526" text-anchor="middle" class="number">4</text>
  <text x="302" y="512" class="issue">对手薄弱</text><text x="302" y="538" class="body">阻力分散或只靠环境？→ 先具体承载，让对手主动、自洽并逼出主角成长</text>

  <path d="M230 568 H970 L930 642 H270 Z" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/>
  <circle cx="300" cy="605" r="22" fill="#0f766e"/><text x="300" y="612" text-anchor="middle" class="number">5</text>
  <text x="342" y="598" class="issue">铺垫过量</text><text x="342" y="624" class="body">前半仍在讲童年与背景？→ 只留当前现状，尽快进入激励事件</text>

  <path d="M270 654 H930 L890 728 H310 Z" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="340" cy="691" r="22" fill="#2563eb"/><text x="340" y="698" text-anchor="middle" class="number">6</text>
  <text x="382" y="684" class="issue">剧情不流动</text><text x="382" y="710" class="body">人物坐聊后局面不变？→ 先设计事件与动作，再让对白在事里工作</text>

  <path d="M310 740 H890 L850 814 H350 Z" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <circle cx="380" cy="777" r="22" fill="#15803d"/><text x="380" y="784" text-anchor="middle" class="number">7</text>
  <text x="422" y="770" class="issue">情绪单一</text><text x="422" y="796" class="body">同一种感受覆盖全片？→ 用色块检查主色、反差、喘息与转换</text>

  <line x1="600" y1="822" x2="600" y2="842" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="400" y="840" width="400" height="30" rx="8" fill="#fefce8" stroke="#fde047"/>
  <text x="600" y="861" text-anchor="middle" class="small">适用边界：这是初稿返修优先级，不是所有作品都必须逐项命中。</text>
</svg>

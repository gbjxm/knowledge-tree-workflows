<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">第十二课：同一母题怎样迁移成不同类型</title>
  <desc id="desc">从原母题基准出发，选择一种主类型的最低承诺，重写人物、关系、世界、冲突、价值和结局六层，再用因果、场景与结局是否改变来判断迁移是否成立。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0v6l9-3z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0v6l9-3z" fill="#dc2626"/>
    </marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .subtitle{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .section{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .module{font:700 19px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .body{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}
      .strong{font:700 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f766e}
      .small{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}
      .badge{font:700 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#ffffff}
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
      .chip{font:700 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}
    </style>
  </defs>

  <rect width="1200" height="880" fill="#f1f5f9"/>
  <rect x="28" y="20" width="1144" height="840" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="60" y="70" class="title">第十二课｜同一母题怎样真正迁移成不同类型</text>
  <text x="60" y="101" class="subtitle">不是替换角色、职业或美术外壳；类型一换，故事的因果系统也要跟着换</text>

  <rect x="60" y="128" width="286" height="646" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <rect x="82" y="150" width="30" height="30" rx="8" fill="#d97706"/>
  <text x="92" y="171" class="badge">1</text>
  <text x="126" y="172" class="section">写清母题基准</text>
  <text x="82" y="208" class="strong">例：小蝌蚪找妈妈</text>
  <text x="82" y="240" class="body">先记录四项，作为迁移前对照：</text>
  <rect x="82" y="258" width="242" height="42" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="100" y="285" class="body">主角　｜谁在行动</text>
  <rect x="82" y="310" width="242" height="42" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="100" y="337" class="body">外部动作｜表面要做什么</text>
  <rect x="82" y="362" width="242" height="42" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="100" y="389" class="body">真正欲望｜为什么非做不可</text>
  <rect x="82" y="414" width="242" height="42" rx="8" fill="#ffffff" stroke="#fed7aa"/>
  <text x="100" y="441" class="body">核心价值｜最终要证明什么</text>

  <text x="82" y="493" class="module">再选一个主发动机</text>
  <text x="82" y="520" class="body">并写出它的 3–4 个最低承诺</text>
  <g>
    <rect x="82" y="536" width="112" height="30" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="98" y="557" class="chip">金羊毛</text>
    <rect x="204" y="536" width="120" height="30" rx="8" fill="#ecfdf5" stroke="#5eead4"/>
    <text x="220" y="557" class="chip">伙伴之爱</text>
    <rect x="82" y="574" width="112" height="30" rx="8" fill="#fff7ed" stroke="#fdba74"/>
    <text x="98" y="595" class="chip">超级英雄</text>
    <rect x="204" y="574" width="120" height="30" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="220" y="595" class="chip">鬼屋</text>
    <rect x="82" y="612" width="112" height="30" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
    <text x="98" y="633" class="chip">侦探推理</text>
    <rect x="204" y="612" width="120" height="30" rx="8" fill="#faf5ff" stroke="#d8b4fe"/>
    <text x="220" y="633" class="chip">如愿以偿</text>
    <rect x="82" y="650" width="112" height="30" rx="8" fill="#fefce8" stroke="#fde047"/>
    <text x="98" y="671" class="chip">麻烦家伙</text>
    <rect x="204" y="650" width="120" height="30" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="220" y="671" class="chip">变迁仪式</text>
    <rect x="82" y="688" width="112" height="30" rx="8" fill="#f0fdf4" stroke="#86efac"/>
    <text x="98" y="709" class="chip">愚者成功</text>
    <rect x="204" y="688" width="120" height="30" rx="8" fill="#f0fdfa" stroke="#5eead4"/>
    <text x="220" y="709" class="chip">被制度化</text>
  </g>
  <text x="82" y="742" class="small">四项是基准，不等于全部锁死；</text>
  <text x="82" y="763" class="small">类型可以重写其中的深层含义。</text>

  <line x1="346" y1="451" x2="382" y2="451" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="392" y="128" width="478" height="646" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="414" y="150" width="30" height="30" rx="8" fill="#2563eb"/>
  <text x="424" y="171" class="badge">2</text>
  <text x="458" y="172" class="section">按类型重写六层</text>
  <text x="414" y="206" class="body">每一层都要进入事件，而不只停在设定说明。</text>

  <rect x="414" y="230" width="206" height="142" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="434" y="260" class="module">01｜人物</text>
  <text x="434" y="290" class="body">主角状态与缺陷</text>
  <text x="434" y="318" class="body">真正欲望与行动能力</text>
  <text x="434" y="348" class="strong">谁变了？为何非做不可？</text>

  <rect x="642" y="230" width="206" height="142" rx="8" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
  <text x="662" y="260" class="module">02｜关系</text>
  <text x="662" y="290" class="body">伙伴承担什么功能</text>
  <text x="662" y="318" class="body">互补、鸿沟与关系代价</text>
  <text x="662" y="348" class="strong">为何必须是这个伙伴？</text>

  <rect x="414" y="390" width="206" height="142" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="434" y="420" class="module">03｜世界</text>
  <text x="434" y="450" class="body">规则、空间与行动限制</text>
  <text x="434" y="478" class="body">威胁怎样持续生效</text>
  <text x="434" y="508" class="strong">环境怎样参与因果？</text>

  <rect x="642" y="390" width="206" height="142" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="662" y="420" class="module">04｜冲突</text>
  <text x="662" y="450" class="body">对手、阻力与升级方式</text>
  <text x="662" y="478" class="body">主类型持续推动什么问题</text>
  <text x="662" y="508" class="strong">压力怎样迫使行动？</text>

  <rect x="414" y="550" width="206" height="142" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text x="434" y="580" class="module">05｜价值选择</text>
  <text x="434" y="610" class="body">揭密、规则或关系代价</text>
  <text x="434" y="638" class="body">必须放弃什么才能完成</text>
  <text x="434" y="668" class="strong">选择是否不可兼得？</text>

  <rect x="642" y="550" width="206" height="142" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="662" y="580" class="module">06｜结果与奖励</text>
  <text x="662" y="610" class="body">外部动作成败</text>
  <text x="662" y="638" class="body">真正获得与人物变化</text>
  <text x="662" y="668" class="strong">结局兑现了哪种承诺？</text>

  <line x1="870" y1="451" x2="906" y2="451" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="916" y="128" width="224" height="646" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <rect x="938" y="150" width="30" height="30" rx="8" fill="#15803d"/>
  <text x="948" y="171" class="badge">3</text>
  <text x="982" y="172" class="section">验收迁移</text>

  <text x="938" y="218" class="module">因果变了吗？</text>
  <text x="938" y="246" class="body">事件为何发生、怎样升级</text>
  <line x1="938" y1="268" x2="1118" y2="268" stroke="#bbf7d0" stroke-width="2"/>
  <text x="938" y="308" class="module">场面变了吗？</text>
  <text x="938" y="336" class="body">人物做的事与承受的压力</text>
  <line x1="938" y1="358" x2="1118" y2="358" stroke="#bbf7d0" stroke-width="2"/>
  <text x="938" y="398" class="module">结局变了吗？</text>
  <text x="938" y="426" class="body">结果、奖励与价值选择</text>

  <rect x="938" y="466" width="180" height="92" rx="8" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="1028" y="500" text-anchor="middle" class="module" fill="#15803d">三项都变</text>
  <text x="1028" y="530" text-anchor="middle" class="body">新类型故事成立</text>

  <rect x="938" y="586" width="180" height="112" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="1028" y="620" text-anchor="middle" class="module">只换外观</text>
  <text x="1028" y="650" text-anchor="middle" class="body">仍是原故事机制</text>
  <text x="1028" y="678" text-anchor="middle" class="body">返回第 2 步重写</text>
  <path d="M938 676 C890 730 854 738 814 700" fill="none" stroke="#dc2626" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-red)"/>

  <rect x="60" y="794" width="1080" height="38" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="84" y="819" class="body">核心结论：主类型组织全片行动；副类型可以增强关系，但必须共享事件、选择和代价。</text>
  <text x="1140" y="850" text-anchor="end" class="small">教学简化：课堂改写多停在梗概层，正式开发仍需八要素、十序列与分场验证</text>
</svg>

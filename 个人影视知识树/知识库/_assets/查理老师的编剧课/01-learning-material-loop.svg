<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">第一课学习闭环：从学习输入到具体文本验收</title>
  <desc id="desc">理论与技巧、双源素材、共情与真实幻想、键盘写作、具体文本验收五个环节形成可反复训练的编剧学习闭环。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#64748b"/></marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.subtitle{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.section{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.node{font:700 19px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.body{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}.badge{font:700 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#fff}.claim{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#14532d}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.nodecard{fill:#fff;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#f1f5f9"/>
  <rect x="28" y="20" width="1144" height="780" rx="8" class="card"/>
  <text x="60" y="70" class="title">第一课：把“想学编剧”变成可重复的学习闭环</text>
  <text x="60" y="102" class="subtitle">每学一个概念，最终都要回到同一个验收：能否写出或改好一个具体文本</text>

  <rect x="60" y="132" width="1080" height="72" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="84" y="162" class="claim">核心结论：编剧是可训练的手艺，理论与技巧只有进入持续写作才算真正掌握</text>
  <text x="84" y="187" class="body">学院理论提供基本功，速成规律提供提示；两者都不能代替观察、加工与实际交付。</text>

  <rect x="60" y="250" width="188" height="168" rx="8" class="nodecard" stroke="#7c3aed"/>
  <rect x="78" y="268" width="30" height="30" rx="8" fill="#7c3aed"/><text x="88" y="289" class="badge">1</text>
  <text x="120" y="290" class="node">学习</text>
  <text x="82" y="326" class="body">理论：建立基本功</text>
  <text x="82" y="354" class="body">技巧：提示结构功能</text>
  <text x="82" y="382" class="small">不把术语或公式当答案</text>

  <rect x="276" y="250" width="188" height="168" rx="8" class="nodecard" stroke="#d97706"/>
  <rect x="294" y="268" width="30" height="30" rx="8" fill="#d97706"/><text x="304" y="289" class="badge">2</text>
  <text x="336" y="290" class="node">采集</text>
  <text x="298" y="326" class="body">影视素材：间接经验</text>
  <text x="298" y="354" class="body">生活素材：直接经验</text>
  <text x="298" y="382" class="small">记录动作、台词与关系变化</text>

  <rect x="492" y="250" width="188" height="168" rx="8" class="nodecard" stroke="#0f766e"/>
  <rect x="510" y="268" width="30" height="30" rx="8" fill="#0f766e"/><text x="520" y="289" class="badge">3</text>
  <text x="552" y="290" class="node">加工</text>
  <text x="514" y="326" class="body">共情：换到他人条件</text>
  <text x="514" y="354" class="body">幻想：诚实且具体</text>
  <text x="514" y="382" class="small">共情不等于认同或免责</text>

  <rect x="708" y="250" width="188" height="168" rx="8" class="nodecard" stroke="#2563eb"/>
  <rect x="726" y="268" width="30" height="30" rx="8" fill="#2563eb"/><text x="736" y="289" class="badge">4</text>
  <text x="768" y="290" class="node">写作</text>
  <text x="730" y="326" class="body">稳定使用键盘输出</text>
  <text x="730" y="354" class="body">把愿望写成用途、关系</text>
  <text x="730" y="382" class="small">原始材料先写下，再加工</text>

  <rect x="924" y="250" width="216" height="168" rx="8" class="nodecard" stroke="#15803d"/>
  <rect x="942" y="268" width="30" height="30" rx="8" fill="#15803d"/><text x="952" y="289" class="badge">5</text>
  <text x="984" y="290" class="node">验收</text>
  <text x="946" y="326" class="body">写出一个具体文本</text>
  <text x="946" y="354" class="body">或改好一个具体问题</text>
  <text x="946" y="382" class="small">不能落笔，就返回最近节点</text>

  <line x1="248" y1="334" x2="266" y2="334" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="464" y1="334" x2="482" y2="334" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="680" y1="334" x2="698" y2="334" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <line x1="896" y1="334" x2="914" y2="334" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M1032 424 V474 H154 V428" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-slate)"/>
  <rect x="446" y="449" width="308" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="600" y="479" text-anchor="middle" class="body">反馈：缺什么，就回到最近节点补什么</text>

  <rect x="60" y="536" width="520" height="154" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="84" y="570" class="section">双源素材怎样记</text>
  <text x="84" y="606" class="body">影视素材：观察别人的故事怎样处理陌生人生</text>
  <text x="84" y="636" class="body">生活素材：保留行为、语言、压力与真实感受</text>
  <text x="84" y="666" class="small">素材不是成品故事，也不是对真人与情节的照搬。</text>

  <rect x="608" y="536" width="532" height="154" rx="8" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
  <text x="632" y="570" class="section">第一课最小行动</text>
  <text x="632" y="606" class="body">今天：准备稳定输入工具，建立口袋素材本</text>
  <text x="632" y="636" class="body">持续：看片、观察、换位，再写一份真实幻想</text>
  <text x="632" y="666" class="small">幻想需写清用途、生活变化、关系靠近与疏远。</text>

  <text x="1140" y="772" text-anchor="end" class="small">适用边界：行业判断与媒介二分是讲者经验，不作为当前统计或硬规则</text>
</svg>

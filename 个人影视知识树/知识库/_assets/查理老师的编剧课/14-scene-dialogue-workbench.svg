<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">第十四课：场景六检与对白五法工作台</title>
  <desc id="desc">从大纲和序列任务进入场景，先通过完整性门槛，再检查信息、推进、变化、对抗、进出和效率；对白由人物与情境托起，并用五种方法写出差异与潜台词。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0v6l9-3z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .subtitle{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .section{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .module{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .body{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}
      .strong{font:700 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f766e}
      .small{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}
      .badge{font:700 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#ffffff}
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f1f5f9"/>
  <rect x="28" y="20" width="1144" height="860" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="60" y="70" class="title">第十四课｜把大纲落成可拍的场景与对白</text>
  <text x="60" y="101" class="subtitle">场景先“扛事”，对白再服从人物与情境；记忆度不能替代故事功能</text>

  <rect x="60" y="124" width="1080" height="84" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="82" y="145" width="226" height="42" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="195" y="172" text-anchor="middle" class="module">大纲 / 序列任务</text>
  <line x1="308" y1="166" x2="390" y2="166" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="400" y="145" width="354" height="42" rx="8" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text x="577" y="172" text-anchor="middle" class="module">场景 = 环境 + 动作 + 对白</text>
  <line x1="754" y1="166" x2="836" y2="166" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="846" y="145" width="272" height="42" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="982" y="172" text-anchor="middle" class="module">制作部门可执行</text>

  <rect x="60" y="232" width="542" height="560" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="82" y="254" width="30" height="30" rx="8" fill="#2563eb"/>
  <text x="92" y="275" class="badge">1</text>
  <text x="126" y="276" class="section">场景工作面｜先完整，再六检</text>

  <rect x="82" y="304" width="498" height="74" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="102" y="333" class="module">完整性门槛</text>
  <text x="102" y="360" class="body">脱离前后文，仍能理解目标、阻力、结果与局面变化吗？</text>

  <rect x="82" y="398" width="238" height="104" rx="8" class="card"/>
  <text x="102" y="428" class="module">01｜信息</text>
  <text x="102" y="456" class="body">观众知道了什么有效信息？</text>
  <text x="102" y="484" class="strong">环境 / 动作 / 对白分担</text>

  <rect x="342" y="398" width="238" height="104" rx="8" class="card"/>
  <text x="362" y="428" class="module">02｜推进</text>
  <text x="362" y="456" class="body">怎样完成上级序列任务？</text>
  <text x="362" y="484" class="strong">加代价 · 减退路 · 改方向</text>

  <rect x="82" y="516" width="238" height="104" rx="8" class="card"/>
  <text x="102" y="546" class="module">03｜变化</text>
  <text x="102" y="574" class="body">场尾与场头相比变了什么？</text>
  <text x="102" y="602" class="strong">局面 / 认知 / 关系 / 行动</text>

  <rect x="342" y="516" width="238" height="104" rx="8" class="card"/>
  <text x="362" y="546" class="module">04｜对抗</text>
  <text x="362" y="574" class="body">人物正在抵抗哪种压力？</text>
  <text x="362" y="602" class="strong">环境 / 对手 / 自我</text>

  <rect x="82" y="634" width="238" height="104" rx="8" class="card"/>
  <text x="102" y="664" class="module">05｜进出</text>
  <text x="102" y="692" class="body">头尾是否停在静态说明？</text>
  <text x="102" y="720" class="strong">从有效动作进入并离开</text>

  <rect x="342" y="634" width="238" height="104" rx="8" class="card"/>
  <text x="362" y="664" class="module">06｜效率</text>
  <text x="362" y="692" class="body">是否只为一条信息搭一场？</text>
  <text x="362" y="720" class="strong">迁移信息 → 合并或删除</text>

  <text x="82" y="770" class="small">不必每场机械满分，但至少应服务信息、推进、变化或整体节奏。</text>

  <rect x="622" y="232" width="518" height="560" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <rect x="644" y="254" width="30" height="30" rx="8" fill="#d97706"/>
  <text x="654" y="275" class="badge">2</text>
  <text x="688" y="276" class="section">对白工作面｜两种来源，五种写法</text>

  <rect x="644" y="304" width="228" height="92" rx="8" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
  <text x="758" y="337" text-anchor="middle" class="module">贴人物</text>
  <text x="758" y="365" text-anchor="middle" class="body">欲望 · 价值 · 性格 · 处境</text>
  <rect x="890" y="304" width="228" height="92" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="1004" y="337" text-anchor="middle" class="module">贴情境</text>
  <text x="1004" y="365" text-anchor="middle" class="body">冲突 · 身份 · 选择 · 压力</text>
  <text x="881" y="422" text-anchor="middle" class="strong">情境越强，台词通常越简练、准确</text>

  <rect x="644" y="444" width="474" height="54" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <rect x="658" y="457" width="28" height="28" rx="8" fill="#d97706"/>
  <text x="667" y="477" class="badge">1</text>
  <text x="700" y="478" class="module">分角色单写</text>
  <text x="844" y="478" class="body">分别进入每个人的背景、立场与处境</text>

  <rect x="644" y="510" width="474" height="54" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <rect x="658" y="523" width="28" height="28" rx="8" fill="#d97706"/>
  <text x="667" y="543" class="badge">2</text>
  <text x="700" y="544" class="module">调用素材库</text>
  <text x="844" y="544" class="body">观察地域、职业、年龄与关系位置</text>

  <rect x="644" y="576" width="474" height="54" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <rect x="658" y="589" width="28" height="28" rx="8" fill="#dc2626"/>
  <text x="667" y="609" class="badge">3</text>
  <text x="700" y="610" class="module">检查问答陷阱</text>
  <text x="862" y="610" class="body">别让人物替作者轮流搬背景</text>

  <rect x="644" y="642" width="474" height="54" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <rect x="658" y="655" width="28" height="28" rx="8" fill="#0f766e"/>
  <text x="667" y="675" class="badge">4</text>
  <text x="700" y="676" class="module">先写潜台词</text>
  <text x="844" y="676" class="body">先写人物要做的事，再转成明台词</text>

  <rect x="644" y="708" width="474" height="54" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <rect x="658" y="721" width="28" height="28" rx="8" fill="#7c3aed"/>
  <text x="667" y="741" class="badge">5</text>
  <text x="700" y="742" class="module">写角色日记</text>
  <text x="844" y="742" class="body">比较同一事件中的注意点与措辞</text>

  <rect x="60" y="814" width="1080" height="38" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="84" y="839" class="body">修改闭环：对白或场景只剩“说明”时，先迁移有效信息，再做合并与删除；不要用华丽措辞掩盖空场。</text>
  <text x="1140" y="870" text-anchor="end" class="small">适用边界：动作进出不等于剧烈运动；对抗也可以是克制、犹豫或礼貌压迫</text>
</svg>

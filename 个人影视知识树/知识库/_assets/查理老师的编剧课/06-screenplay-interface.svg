<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">第六课：剧本格式是制作协作接口</title>
  <desc id="desc">场景标题与正文中的环境、行动、对白被不同制作部门稳定读取。格式用于传递可执行信息，页数和字数只能辅助估算时长。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0 0v6l9-3z" fill="#2563eb"/>
    </marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .subtitle{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .section{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .module{font:700 20px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .body{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}
      .strong{font:700 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .small{font:400 15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}
      .badge{font:700 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#ffffff}
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>

  <rect width="1200" height="820" fill="#f1f5f9"/>
  <rect x="28" y="20" width="1144" height="780" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="60" y="70" class="title">第六课：剧本格式是制作协作接口</text>
  <text x="60" y="101" class="subtitle">同一页文字，要让不同岗位快速找到自己需要执行的信息</text>

  <rect x="60" y="130" width="286" height="474" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="84" y="170" class="section">1　写作输入</text>

  <rect x="82" y="194" width="242" height="158" rx="8" class="card" stroke="#2563eb"/>
  <rect x="98" y="210" width="34" height="28" rx="8" fill="#2563eb"/>
  <text x="108" y="230" class="badge">A</text>
  <text x="144" y="231" class="module">场景标题</text>
  <text x="102" y="269" class="body">场号　场景</text>
  <text x="102" y="299" class="body">时间　内景 / 外景</text>
  <text x="102" y="329" class="small">回答：在哪里、何时、怎么拍</text>

  <rect x="82" y="374" width="242" height="202" rx="8" class="card" stroke="#0f766e"/>
  <rect x="98" y="390" width="34" height="28" rx="8" fill="#0f766e"/>
  <text x="108" y="410" class="badge">B</text>
  <text x="144" y="411" class="module">场景正文</text>
  <text x="102" y="449" class="body">环境：空间现在怎样</text>
  <text x="102" y="479" class="body">行动：人物做了什么</text>
  <text x="102" y="509" class="body">对白：人物说了什么</text>
  <text x="102" y="548" class="small">心理判断需转成可执行信息</text>

  <line x1="346" y1="364" x2="430" y2="364" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="360" y="344" class="strong">稳定编码</text>

  <rect x="448" y="208" width="300" height="312" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
  <rect x="478" y="232" width="92" height="30" rx="8" fill="#2563eb"/>
  <text x="499" y="253" class="badge">共享页面</text>
  <text x="478" y="304" class="section">剧本</text>
  <text x="478" y="340" class="body">不是排版考试</text>
  <text x="478" y="370" class="body">而是全组共同读取的</text>
  <text x="478" y="400" class="body">场景、行动与关系说明</text>
  <line x1="478" y1="428" x2="718" y2="428" stroke="#93c5fd" stroke-width="2"/>
  <text x="478" y="462" class="strong">核心验收</text>
  <text x="478" y="490" class="body">岗位能否据此准备和执行？</text>

  <line x1="748" y1="364" x2="826" y2="364" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow-blue)"/>
  <text x="763" y="344" class="strong">分工读取</text>

  <rect x="844" y="130" width="296" height="474" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="868" y="170" class="section">2　制作输出</text>

  <rect x="866" y="194" width="122" height="104" rx="8" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="882" y="225" class="strong">制片统筹</text>
  <text x="882" y="255" class="body">场号 · 场次</text>
  <text x="882" y="282" class="small">规模与计划</text>

  <rect x="996" y="194" width="122" height="104" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>
  <text x="1012" y="225" class="strong">场地外联</text>
  <text x="1012" y="255" class="body">场景 · 内外</text>
  <text x="1012" y="282" class="small">勘景与许可</text>

  <rect x="866" y="316" width="122" height="104" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="882" y="347" class="strong">灯光摄影</text>
  <text x="882" y="377" class="body">时间 · 内外</text>
  <text x="882" y="404" class="small">光线与机位</text>

  <rect x="996" y="316" width="122" height="104" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1012" y="347" class="strong">美术道具</text>
  <text x="1012" y="377" class="body">环境 · 状态</text>
  <text x="1012" y="404" class="small">空间可见信息</text>

  <rect x="866" y="438" width="122" height="132" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="882" y="469" class="strong">导演表演</text>
  <text x="882" y="499" class="body">行动 · 对白</text>
  <text x="882" y="526" class="small">调度与关系</text>
  <text x="882" y="551" class="small">表演落点</text>

  <rect x="996" y="438" width="122" height="132" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
  <text x="1012" y="469" class="strong">剪辑声音</text>
  <text x="1012" y="499" class="body">动作 · 对白</text>
  <text x="1012" y="526" class="small">节奏与声音</text>
  <text x="1012" y="551" class="small">执行依据</text>

  <rect x="60" y="634" width="1080" height="118" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="84" y="673" class="section">3　时长估算不是格式真理</text>
  <text x="84" y="707" class="body">英文“一页约一分钟”有计时目的；中文信息密度不同，约 350 字 / 分钟只能粗估。</text>
  <text x="84" y="736" class="body">追逐、动作和大场面常是少量文字对应较长成片，最终仍要回到场面规模与导演执行。</text>
  <text x="1140" y="783" text-anchor="end" class="small">适用边界：格式可统一读取方式，不能替代故事判断或现场拆解</text>
</svg>

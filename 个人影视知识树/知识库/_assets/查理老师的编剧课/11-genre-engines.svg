<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">第十一课：十类型的最低叙事承诺</title>
  <desc id="desc">十种类型以故事发动机和最低承诺组成双栏矩阵。先找主发动机，再核对最低承诺，最后回到八要素和十序列完成故事。</desc>
  <defs>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .subtitle{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .section{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .type{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .body{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}
      .promise{font:700 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f766e}
      .small{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}
      .badge{font:700 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#ffffff}
      .step{font:700 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1d4ed8}
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>

  <rect width="1200" height="920" fill="#f1f5f9"/>
  <rect x="28" y="20" width="1144" height="880" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="60" y="70" class="title">第十一课｜十类型的最低叙事承诺</text>
  <text x="60" y="101" class="subtitle">类型不是画面元素清单，而是“故事靠什么持续发动”的专项检查</text>

  <rect x="60" y="124" width="1080" height="70" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="84" y="153" class="step">1　找主发动机</text>
  <text x="252" y="153" class="body">谁在追求什么？观众持续等待哪类问题的答案？</text>
  <text x="84" y="179" class="step">2　验最低承诺</text>
  <text x="252" y="179" class="body">用三至四个锁定点做反事实测试；成立后仍要放回八要素与十序列。</text>

  <text x="60" y="228" class="section">A｜行动、关系、能力、空间与秘密</text>
  <text x="620" y="228" class="section">B｜愿望、危机、成长、机构与制度</text>

  <g>
    <rect x="60" y="246" width="520" height="104" rx="8" class="card"/>
    <rect x="78" y="264" width="28" height="28" rx="8" fill="#2563eb"/>
    <text x="87" y="284" class="badge">1</text>
    <text x="120" y="285" class="type">金羊毛</text>
    <text x="120" y="312" class="body">发动机：向明确目标前进，并在旅程中变化</text>
    <text x="120" y="338" class="promise">最低承诺：路径 · 团队 · 奖品</text>

    <rect x="620" y="246" width="520" height="104" rx="8" class="card"/>
    <rect x="638" y="264" width="28" height="28" rx="8" fill="#7c3aed"/>
    <text x="647" y="284" class="badge">6</text>
    <text x="680" y="285" class="type">如愿以偿</text>
    <text x="680" y="312" class="body">发动机：愿望突然实现，反过来考验人物</text>
    <text x="680" y="338" class="promise">最低承诺：共情愿望 · 规则 / 限制 · 教训</text>
  </g>

  <g>
    <rect x="60" y="364" width="520" height="104" rx="8" class="card"/>
    <rect x="78" y="382" width="28" height="28" rx="8" fill="#0f766e"/>
    <text x="87" y="402" class="badge">2</text>
    <text x="120" y="403" class="type">伙伴之爱</text>
    <text x="120" y="430" class="body">发动机：两个互补的人彼此需要，却难以结合</text>
    <text x="120" y="456" class="promise">最低承诺：双方残缺 · 相互补足 · 巨大沟壑</text>

    <rect x="620" y="364" width="520" height="104" rx="8" class="card"/>
    <rect x="638" y="382" width="28" height="28" rx="8" fill="#dc2626"/>
    <text x="647" y="402" class="badge">7</text>
    <text x="680" y="403" class="type">麻烦家伙</text>
    <text x="680" y="430" class="body">发动机：普通无辜者被从天而降的大事卷入</text>
    <text x="680" y="456" class="promise">最低承诺：无辜小人物 · 突降麻烦 · 生死考验</text>
  </g>

  <g>
    <rect x="60" y="482" width="520" height="104" rx="8" class="card"/>
    <rect x="78" y="500" width="28" height="28" rx="8" fill="#d97706"/>
    <text x="87" y="520" class="badge">3</text>
    <text x="120" y="521" class="type">超级英雄</text>
    <text x="120" y="548" class="body">发动机：超常人物承担超越私利的使命</text>
    <text x="120" y="574" class="promise">最低承诺：能力 · 命门 · 对手 · 使命</text>

    <rect x="620" y="482" width="520" height="104" rx="8" class="card"/>
    <rect x="638" y="500" width="28" height="28" rx="8" fill="#15803d"/>
    <text x="647" y="520" class="badge">8</text>
    <text x="680" y="521" class="type">人生变迁</text>
    <text x="680" y="548" class="body">发动机：人物用错误方式处理常见人生问题</text>
    <text x="680" y="574" class="promise">最低承诺：常见问题 · 错误应对 · 成熟回归</text>
  </g>

  <g>
    <rect x="60" y="600" width="520" height="104" rx="8" class="card"/>
    <rect x="78" y="618" width="28" height="28" rx="8" fill="#dc2626"/>
    <text x="87" y="638" class="badge">4</text>
    <text x="120" y="639" class="type">鬼屋</text>
    <text x="120" y="666" class="body">发动机：人物被困在危险空间并承受致命追击</text>
    <text x="120" y="692" class="promise">最低承诺：封闭空间 · 致命力量 · 原罪</text>

    <rect x="620" y="600" width="520" height="104" rx="8" class="card"/>
    <rect x="638" y="618" width="28" height="28" rx="8" fill="#d97706"/>
    <text x="647" y="638" class="badge">9</text>
    <text x="680" y="639" class="type">愚者成功</text>
    <text x="680" y="666" class="body">发动机：不适应规则的人进入强势机构并成功</text>
    <text x="680" y="692" class="promise">最低承诺：愚者 · 机构 / 环境 · 保留自我的变化</text>
  </g>

  <g>
    <rect x="60" y="718" width="520" height="104" rx="8" class="card"/>
    <rect x="78" y="736" width="28" height="28" rx="8" fill="#7c3aed"/>
    <text x="87" y="756" class="badge">5</text>
    <text x="120" y="757" class="type">侦探推理</text>
    <text x="120" y="784" class="body">发动机：探秘者带观众揭开秘密</text>
    <text x="120" y="810" class="promise">最低承诺：秘密 · 探秘者 · 牺牲 / 价值选择</text>

    <rect x="620" y="718" width="520" height="104" rx="8" class="card"/>
    <rect x="638" y="736" width="32" height="28" rx="8" fill="#0f766e"/>
    <text x="646" y="756" class="badge">10</text>
    <text x="684" y="757" class="type">被制度化</text>
    <text x="684" y="784" class="body">发动机：个体在群体规则与自我之间作出选择</text>
    <text x="684" y="810" class="promise">最低承诺：群体 · 个人选择 · 抗争 / 牺牲</text>
  </g>

  <rect x="60" y="840" width="1080" height="38" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="84" y="865" class="body">核心结论：一部作品可混合或切换类型；选能解释主要因果与高潮选择的主发动机，不必强行排他。</text>
  <text x="1140" y="892" text-anchor="end" class="small">教学简化：最低承诺是专项压力测试，不是完整写作公式</text>
</svg>

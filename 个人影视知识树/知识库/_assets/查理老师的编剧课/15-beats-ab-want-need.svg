<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">十五节拍与 A/B、Want/Need 双轨检查</title>
  <desc id="desc">上半部分按起承转合列出十五个节拍及三幕位置，下半部分区分由 Want 驱动的外在 A 线和由 Need 驱动的内在 B 线。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#0f766e"/></marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .subtitle{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .section{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .label{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .body{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}
      .small{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}
      .beat{font:700 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .time{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}
      .phase{font:700 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#ffffff}
      .core{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1e3a8a}
      .card{fill:#ffffff;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="900" fill="#f1f5f9"/>
  <rect x="28" y="20" width="1144" height="860" rx="8" class="card"/>
  <text x="60" y="68" class="title">第15课｜十五节拍与人物双轨</text>
  <text x="60" y="99" class="subtitle">节拍回答“何时承担什么功能”；A/B 回答“同一事件推进外在目标，还是内在成长”</text>

  <rect x="60" y="120" width="1080" height="48" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="600" y="151" text-anchor="middle" class="core">先沿节拍找结构功能，再用 Want / Need 检查人物是否只忙于做事却没有变化</text>

  <rect x="60" y="190" width="1080" height="420" rx="8" class="card"/>
  <text x="82" y="222" class="section">一、十五节拍：约 110 分钟示范尺度</text>

  <rect x="82" y="244" width="128" height="72" rx="8" fill="#2563eb"/>
  <text x="146" y="273" text-anchor="middle" class="phase">第一幕｜起</text>
  <text x="146" y="297" text-anchor="middle" class="phase">0–25 分钟</text>
  <rect x="224" y="244" width="170" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="309" y="272" text-anchor="middle" class="beat">1 开场画面</text><text x="309" y="296" text-anchor="middle" class="time">00–02｜作品契约</text>
  <rect x="406" y="244" width="170" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="491" y="272" text-anchor="middle" class="beat">2 点主题</text><text x="491" y="296" text-anchor="middle" class="time">约05｜价值问题</text>
  <rect x="588" y="244" width="170" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="673" y="272" text-anchor="middle" class="beat">3 铺垫</text><text x="673" y="296" text-anchor="middle" class="time">01–10｜常态与缺失</text>
  <rect x="770" y="244" width="170" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="855" y="272" text-anchor="middle" class="beat">4 推动／激励</text><text x="855" y="296" text-anchor="middle" class="time">约12｜打破常态</text>
  <rect x="952" y="244" width="166" height="72" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1035" y="272" text-anchor="middle" class="beat">5 争执</text><text x="1035" y="296" text-anchor="middle" class="time">12–25｜旧办法失效</text>

  <rect x="82" y="330" width="128" height="72" rx="8" fill="#0f766e"/>
  <text x="146" y="359" text-anchor="middle" class="phase">第二幕A｜承</text>
  <text x="146" y="383" text-anchor="middle" class="phase">25–55 分钟</text>
  <rect x="224" y="330" width="215" height="72" rx="8" fill="#ecfdf5" stroke="#5eead4"/>
  <text x="331" y="358" text-anchor="middle" class="beat">6 第二幕衔接点</text><text x="331" y="382" text-anchor="middle" class="time">约25｜决定上路</text>
  <rect x="451" y="330" width="215" height="72" rx="8" fill="#ecfdf5" stroke="#5eead4"/>
  <text x="558" y="358" text-anchor="middle" class="beat">7 B 故事</text><text x="558" y="382" text-anchor="middle" class="time">约30｜Need 开始显形</text>
  <rect x="678" y="330" width="215" height="72" rx="8" fill="#ecfdf5" stroke="#5eead4"/>
  <text x="785" y="358" text-anchor="middle" class="beat">8 游戏时间</text><text x="785" y="382" text-anchor="middle" class="time">30–50｜兑现类型承诺</text>
  <rect x="905" y="330" width="213" height="72" rx="8" fill="#ecfdf5" stroke="#5eead4"/>
  <text x="1011" y="358" text-anchor="middle" class="beat">9 中点</text><text x="1011" y="382" text-anchor="middle" class="time">约55｜伪胜利与反噬</text>

  <rect x="82" y="416" width="128" height="72" rx="8" fill="#d97706"/>
  <text x="146" y="445" text-anchor="middle" class="phase">第二幕B｜转</text>
  <text x="146" y="469" text-anchor="middle" class="phase">55–85 分钟</text>
  <rect x="224" y="416" width="290" height="72" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="369" y="444" text-anchor="middle" class="beat">10 坏蛋逼近</text><text x="369" y="468" text-anchor="middle" class="time">55–75｜阻力与伏笔收紧</text>
  <rect x="526" y="416" width="290" height="72" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="671" y="444" text-anchor="middle" class="beat">11 一无所有</text><text x="671" y="468" text-anchor="middle" class="time">约75｜外部重创</text>
  <rect x="828" y="416" width="290" height="72" rx="8" fill="#fff7ed" stroke="#fdba74"/>
  <text x="973" y="444" text-anchor="middle" class="beat">12 灵魂黑夜</text><text x="973" y="468" text-anchor="middle" class="time">75–85｜内部消化与重生</text>

  <rect x="82" y="502" width="128" height="72" rx="8" fill="#7c3aed"/>
  <text x="146" y="531" text-anchor="middle" class="phase">第三幕｜合</text>
  <text x="146" y="555" text-anchor="middle" class="phase">85–110 分钟</text>
  <rect x="224" y="502" width="290" height="72" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="369" y="530" text-anchor="middle" class="beat">13 第三幕衔接点</text><text x="369" y="554" text-anchor="middle" class="time">约85｜接受最难方案</text>
  <rect x="526" y="502" width="290" height="72" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="671" y="530" text-anchor="middle" class="beat">14 结局／高潮</text><text x="671" y="554" text-anchor="middle" class="time">85–110｜外内双线终检</text>
  <rect x="828" y="502" width="290" height="72" rx="8" fill="#f5f3ff" stroke="#c4b5fd"/>
  <text x="973" y="530" text-anchor="middle" class="beat">15 终场画面</text><text x="973" y="554" text-anchor="middle" class="time">约110｜新状态回应开场</text>

  <rect x="60" y="632" width="1080" height="184" rx="8" class="card"/>
  <text x="82" y="664" class="section">二、A / B 双轨：同一事件可以同时打两种点</text>
  <rect x="82" y="684" width="482" height="100" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="104" y="713" class="label">A 故事｜Want 驱动外在行动</text>
  <text x="104" y="744" class="body">接任务 → 上路 → 受阻 → 换方案 → 外部结果</text>
  <text x="104" y="772" class="small">检查：人物做了什么？目标进度如何改变？</text>
  <line x1="574" y1="734" x2="620" y2="734" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="628" y="684" width="490" height="100" rx="8" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
  <text x="650" y="713" class="label">B 故事｜Need 驱动内在成长</text>
  <text x="650" y="744" class="body">被触动 → 旧信念受挫 → 新选择 → 人物弧光</text>
  <text x="650" y="772" class="small">检查：人物为何变化？关系或信念如何被看见？</text>

  <rect x="60" y="834" width="1080" height="30" rx="8" fill="#fefce8" stroke="#fde047"/>
  <text x="600" y="855" text-anchor="middle" class="small">教学简化：分钟数用于理解功能，不是自然定律；节拍表提供问题，不替代素材、因果与人物判断。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">第四课五个故事支点</title>
  <desc id="desc">身份、激励事件、过激行为、悬念和环境五个支点提供五种启动故事的入口，并以类型承诺和因果创新约束原创边界。</desc>
  <defs><style>
    .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.subtitle{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.section{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.head{font:700 19px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.body{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}.badge{font:700 15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#fff}.claim{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#14532d}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.row{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
  </style></defs>
  <rect width="1200" height="900" fill="#f1f5f9"/><rect x="28" y="20" width="1144" height="860" rx="8" class="card"/>
  <text x="60" y="70" class="title">第四课：没有起点时，用五个故事支点启动</text>
  <text x="60" y="102" class="subtitle">支点是八要素中足以成为“第一笔”的强点；先找最强入口，再反推其余因果</text>
  <rect x="60" y="130" width="1080" height="68" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="84" y="159" class="claim">一个强点让故事成立，两个开始精彩，三个已经相当有力</text>
  <text x="84" y="184" class="small">以上为讲者的经验口令，不是必须凑满的评分公式。</text>

  <rect x="60" y="226" width="1080" height="48" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="84" y="257" class="head">支点</text><text x="280" y="257" class="head">怎样发动故事</text><text x="800" y="257" class="head">快速自检</text>

  <rect x="60" y="286" width="1080" height="86" rx="8" class="row"/><rect x="82" y="307" width="34" height="34" rx="8" fill="#0f766e"/><text x="94" y="330" class="badge">1</text><text x="134" y="330" class="head">身份</text><text x="280" y="330" class="body">反常但可信的人物位置，自带行动矛盾</text><text x="800" y="330" class="body">讲给朋友，能否让对方抬头？</text><text x="280" y="357" class="small">例：小人物遇大事，或大人物被迫处理“小事”</text>
  <rect x="60" y="384" width="1080" height="86" rx="8" class="row"/><rect x="82" y="405" width="34" height="34" rx="8" fill="#2563eb"/><text x="94" y="428" class="badge">2</text><text x="134" y="428" class="head">激励事件</text><text x="280" y="428" class="body">打破这个人物的日常，迫使状态改变</text><text x="800" y="428" class="body">此人还能继续原来的生活吗？</text><text x="280" y="455" class="small">大小取决于对特定主角的干扰，不取决于客观规模</text>
  <rect x="60" y="482" width="1080" height="86" rx="8" class="row"/><rect x="82" y="503" width="34" height="34" rx="8" fill="#d97706"/><text x="94" y="526" class="badge">3</text><text x="134" y="526" class="head">过激行为</text><text x="280" y="526" class="body">惯常动作失败后，采取超出常规的第二次行动</text><text x="800" y="526" class="body">是否生成新制度、人物与后果？</text><text x="280" y="553" class="small">升级不是喊得更响，而是行动真正改变局面</text>
  <rect x="60" y="580" width="1080" height="86" rx="8" class="row"/><rect x="82" y="601" width="34" height="34" rx="8" fill="#dc2626"/><text x="94" y="624" class="badge">4</text><text x="134" y="624" class="head">悬念</text><text x="280" y="624" class="body">危机、秘密、假身份或时间锁保持未解决</text><text x="800" y="624" class="body">观众是否会追问“后来呢”？</text><text x="280" y="651" class="small">像一颗“悬而未决的炸弹”，持续压住注意力</text>
  <rect x="60" y="678" width="1080" height="86" rx="8" class="row"/><rect x="82" y="699" width="34" height="34" rx="8" fill="#7c3aed"/><text x="94" y="722" class="badge">5</text><text x="134" y="722" class="head">环境</text><text x="280" y="722" class="body">空间自带限制、反差与行动规则</text><text x="800" y="722" class="body">换掉环境，故事还能照样发生吗？</text><text x="280" y="749" class="small">荒岛、修道院等环境会主动约束人物选择</text>

  <rect x="60" y="790" width="520" height="62" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="84" y="818" class="section">类型承诺</text><text x="84" y="842" class="small">兑现观众确认类型所需的基本预期</text>
  <rect x="620" y="790" width="520" height="62" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="644" y="818" class="section">因果内的新鲜变化</text><text x="644" y="842" class="small">“一半海水，一半火焰”：创新不等于全面反预期</text>
  <text x="1140" y="876" text-anchor="end" class="small">教学简化：五个支点可单独起步，也可组合；不是要求每个故事平均配置五项</text>
</svg>

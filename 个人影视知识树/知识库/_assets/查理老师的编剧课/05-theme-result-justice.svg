<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
  <title id="title">第五课结果正义与主题正义双轨图</title>
  <desc id="desc">外部任务的输赢与人物选择所表达的价值是两条不同轨道；杀人回忆案例展示案件失败与双主角位置互换可以同时成立。</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#dc2626"/></marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.subtitle{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.section{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.head{font:700 19px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.body{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:400 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#64748b}.badge{font:700 14px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#fff}.claim{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#14532d}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.box{fill:#fff;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="880" fill="#f1f5f9"/><rect x="28" y="20" width="1144" height="840" rx="8" class="card"/>
  <text x="60" y="70" class="title">第五课：外部失败，为什么主题仍然可以成立</text>
  <text x="60" y="102" class="subtitle">把“任务有没有赢”与“作品通过人物变化表达什么价值”分成两条轨道检查</text>
  <rect x="60" y="130" width="1080" height="66" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text x="600" y="171" text-anchor="middle" class="claim">结果正义 ≠ 主题正义：失败、黑暗或未解决，不等于作品没有清楚立场</text>

  <rect x="60" y="230" width="188" height="120" rx="8" class="box" stroke="#94a3b8"/>
  <text x="84" y="268" class="section">同一个结局</text><text x="84" y="302" class="body">外部事件落点</text><text x="84" y="330" class="body">人物最终选择</text>

  <rect x="284" y="218" width="856" height="142" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="308" y="238" width="92" height="30" rx="8" fill="#2563eb"/><text x="326" y="259" class="badge">结果轨</text>
  <text x="424" y="260" class="section">任务与事实状态</text>
  <rect x="308" y="284" width="226" height="52" rx="8" class="box" stroke="#2563eb"/><text x="421" y="316" text-anchor="middle" class="body">任务成功／失败？</text>
  <line x1="544" y1="310" x2="622" y2="310" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="632" y="284" width="226" height="52" rx="8" class="box" stroke="#2563eb"/><text x="745" y="316" text-anchor="middle" class="body">邪恶受罚／逃脱？</text>
  <line x1="868" y1="310" x2="946" y2="310" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <rect x="956" y="284" width="160" height="52" rx="8" class="box" stroke="#2563eb"/><text x="1036" y="316" text-anchor="middle" class="body">局面结果</text>

  <rect x="284" y="384" width="856" height="162" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <rect x="308" y="404" width="92" height="30" rx="8" fill="#d97706"/><text x="326" y="425" class="badge">主题轨</text>
  <text x="424" y="426" class="section">人物与价值变化</text>
  <rect x="308" y="452" width="226" height="64" rx="8" class="box" stroke="#d97706"/><text x="421" y="478" text-anchor="middle" class="body">高潮选择</text><text x="421" y="502" text-anchor="middle" class="small">人物真正站在哪边</text>
  <line x1="544" y1="484" x2="622" y2="484" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <rect x="632" y="452" width="226" height="64" rx="8" class="box" stroke="#dc2626"/><text x="745" y="478" text-anchor="middle" class="body">承担代价</text><text x="745" y="502" text-anchor="middle" class="small">选择是否真的有重量</text>
  <line x1="868" y1="484" x2="946" y2="484" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-red)"/>
  <rect x="956" y="452" width="160" height="64" rx="8" class="box" stroke="#15803d"/><text x="1036" y="478" text-anchor="middle" class="body">价值落地</text><text x="1036" y="502" text-anchor="middle" class="small">肯定／反对／拷问</text>

  <rect x="60" y="586" width="1080" height="188" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="84" y="620" class="section">案例：《杀人回忆》的“双轨同时成立”</text>
  <rect x="84" y="646" width="260" height="96" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text x="106" y="678" class="head">外部结果</text><text x="106" y="710" class="body">案件失败，真凶未被抓住</text>
  <rect x="380" y="646" width="306" height="96" rx="8" fill="#ecfdf5" stroke="#5eead4" stroke-width="2"/>
  <text x="402" y="678" class="head">本地警察</text><text x="402" y="710" class="body">直觉／伪证 → 阻止同伴开枪</text>
  <rect x="722" y="646" width="306" height="96" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="744" y="678" class="head">学院派警察</text><text x="744" y="710" class="body">程序／科学 → 在挫败中失控</text>
  <path d="M514 734 C570 760 664 760 808 734" fill="none" stroke="#7c3aed" stroke-width="3" stroke-dasharray="8 7"/>
  <rect x="388" y="740" width="424" height="28" rx="8" fill="#faf5ff"/>
  <text x="600" y="760" text-anchor="middle" class="small">人物位置交叉：两人互相影响，关系与价值判断发生变化</text>

  <text x="60" y="818" class="body">检查方法：去掉主题解释台词，只看人物在高潮怎样选择、付出什么、最终改变了什么。</text>
  <text x="1140" y="844" text-anchor="end" class="small">适用边界：主题正义不要求圆满结局或道德说教；具体价值仍须结合类型与作者表达判断</text>
</svg>

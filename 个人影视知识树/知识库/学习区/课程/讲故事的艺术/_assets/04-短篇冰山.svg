<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">短篇冰山：用一个可见切片暗示更大人生与世界</title>
  <desc id="desc">教学隐喻图。水面上是短篇实际写出的关键时刻、人物欲望、转折与情绪落点；水面下是被少数细节暗示的过去、世界规则、关系历史和余震。</desc>
  <style>
    .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0F172A}
    .subtitle{font:400 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
    .panelTitle{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0F172A}
    .iceTitle{font:700 20px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0F172A}
    .body{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}
    .small{font:400 15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
    .step{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0F172A}
    .tag{font:700 15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#FFFFFF}
    .take{font:700 19px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0F172A}
  </style>

  <rect width="1200" height="780" fill="#F1F5F9"/>
  <rect x="30" y="24" width="1140" height="732" rx="24" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/>
  <text x="70" y="76" class="title">短篇不是“缩小的长篇”，而是一个关键切片</text>
  <text x="70" y="108" class="subtitle">P7–P8 课程原意；冰山仅为教学隐喻，不表示真实比例</text>

  <rect x="60" y="145" width="660" height="486" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  <rect x="82" y="313" width="616" height="296" fill="#E0F2FE"/>
  <path d="M82 313 C160 298 224 329 302 313 C380 297 444 329 522 313 C588 300 642 321 698 313" fill="none" stroke="#0284C7" stroke-width="4"/>
  <text x="100" y="299" class="small" fill="#0369A1">水面：作品实际写出的部分</text>

  <polygon points="244,313 382,194 526,313" fill="#EFF6FF" stroke="#60A5FA" stroke-width="2"/>
  <text x="384" y="226" text-anchor="middle" class="iceTitle">可见切片</text>
  <text x="384" y="258" text-anchor="middle" class="body">一个关键时刻</text>
  <text x="384" y="286" text-anchor="middle" class="small">不是人生摘要</text>

  <polygon points="244,336 526,336 620,586 124,586" fill="#BFDBFE" stroke="#60A5FA" stroke-width="2"/>
  <text x="372" y="386" text-anchor="middle" class="iceTitle">未写出，但必须被暗示</text>

  <rect x="160" y="418" width="170" height="58" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="245" y="442" text-anchor="middle" class="step">人物的过去</text>
  <text x="245" y="465" text-anchor="middle" class="small">关系与旧身份</text>

  <rect x="350" y="418" width="210" height="58" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="455" y="442" text-anchor="middle" class="step">更大的世界</text>
  <text x="455" y="465" text-anchor="middle" class="small">规则、历史与远景</text>

  <rect x="255" y="498" width="210" height="58" rx="14" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2"/>
  <text x="360" y="522" text-anchor="middle" class="step">事件之后的余震</text>
  <text x="360" y="545" text-anchor="middle" class="small">读者继续补全</text>

  <g aria-label="少数细节连接可见与未写部分">
    <line x1="185" y1="350" x2="185" y2="408" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
    <circle cx="185" cy="350" r="8" fill="#D97706"/>
    <text x="100" y="375" class="small">动作／称呼</text>
    <line x1="580" y1="350" x2="580" y2="408" stroke="#D97706" stroke-width="3" stroke-dasharray="6 5"/>
    <circle cx="580" cy="350" r="8" fill="#D97706"/>
    <text x="548" y="375" class="small">天气／物件</text>
  </g>

  <rect x="750" y="145" width="390" height="486" rx="20" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/>
  <text x="778" y="184" class="panelTitle">怎样选择这个切片？</text>

  <g aria-label="短篇压缩四步">
    <circle cx="800" cy="235" r="18" fill="#D97706"/>
    <text x="800" y="241" text-anchor="middle" class="tag">1</text>
    <text x="832" y="230" class="step">锁定一个时刻</text>
    <text x="832" y="257" class="body">发现、转折或不得不选</text>

    <line x1="800" y1="257" x2="800" y2="292" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="800" cy="315" r="18" fill="#D97706"/>
    <text x="800" y="321" text-anchor="middle" class="tag">2</text>
    <text x="832" y="310" class="step">给当下具体欲望</text>
    <text x="832" y="337" class="body">让冲突在场景内发生</text>

    <line x1="800" y1="337" x2="800" y2="372" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="800" cy="395" r="18" fill="#D97706"/>
    <text x="800" y="401" text-anchor="middle" class="tag">3</text>
    <text x="832" y="390" class="step">只留少数支点</text>
    <text x="832" y="417" class="body">用细节让背景施加压力</text>

    <line x1="800" y1="417" x2="800" y2="452" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="800" cy="475" r="18" fill="#D97706"/>
    <text x="800" y="481" text-anchor="middle" class="tag">4</text>
    <text x="832" y="470" class="step">形成明确落点</text>
    <text x="832" y="497" class="body">情绪或认知发生变化</text>
  </g>

  <rect x="778" y="539" width="334" height="64" rx="14" fill="#FFFFFF" stroke="#FCD34D" stroke-width="2"/>
  <text x="945" y="566" text-anchor="middle" class="step">短，不等于解释得少</text>
  <text x="945" y="590" text-anchor="middle" class="small">而是让有限细节承担更多</text>

  <rect x="60" y="660" width="1080" height="64" rx="18" fill="#EFF6FF" stroke="#93C5FD" stroke-width="2"/>
  <text x="600" y="700" text-anchor="middle" class="take">判断：读者只看见一个近景，却能感觉人物从别处来，并将继续走向别处</text>
</svg>

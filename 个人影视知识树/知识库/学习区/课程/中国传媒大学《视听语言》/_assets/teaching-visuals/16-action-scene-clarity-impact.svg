<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">动作场面：先让人看懂，再制造冲击</title><desc id="desc">动作场面从空间基准、动作关节、镜头覆盖到运动和声音冲击，形成由可读性到冲击力的教学链。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><style>.title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:400 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.pt{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.body{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}</style></defs>
  <rect width="1200" height="800" fill="#f1f5f9"/><rect x="30" y="24" width="1140" height="752" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="76" class="title">动作场面：先让人看懂，再制造冲击</text><text x="70" y="108" class="sub">阅读顺序：空间基准 → 动作关节 → 覆盖层次 → 视听重击</text>
  <g><rect x="60" y="145" width="245" height="470" rx="18" class="panel"/><text x="84" y="183" class="pt">① 空间基准</text><rect x="85" y="220" width="195" height="225" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><circle cx="130" cy="320" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="130" y="327" text-anchor="middle" class="body">甲</text><circle cx="235" cy="320" r="24" fill="#fee2e2" stroke="#ef4444" stroke-width="3"/><text x="235" y="327" text-anchor="middle" class="body">乙</text><line x1="158" y1="320" x2="205" y2="320" stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"/><rect x="178" y="240" width="28" height="34" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="182" y="418" text-anchor="middle" class="small">起点 · 目标 · 障碍 · 方向</text><text x="84" y="490" class="body">先回答：谁在哪里？</text><text x="84" y="522" class="body">要做什么？结果落哪里？</text></g>
  <line x1="313" y1="380" x2="338" y2="380" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <g><rect x="350" y="145" width="245" height="470" rx="18" class="panel"/><text x="374" y="183" class="pt">② 动作关节</text><g transform="translate(382 235)"><rect width="180" height="60" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="90" y="37" text-anchor="middle" class="body">准备 / 蓄力</text><line x1="90" y1="65" x2="90" y2="90" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><rect y="100" width="180" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><text x="90" y="137" text-anchor="middle" class="body">执行 / 运动</text><line x1="90" y1="165" x2="90" y2="190" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><rect y="200" width="180" height="60" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/><text x="90" y="237" text-anchor="middle" class="body">击中 / 结果</text></g><text x="374" y="545" class="small">动作因果不断，才能动接动。</text></g>
  <line x1="603" y1="380" x2="628" y2="380" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <g><rect x="640" y="145" width="245" height="470" rx="18" class="panel"/><text x="664" y="183" class="pt">③ 覆盖层次</text><rect x="665" y="220" width="195" height="88" rx="9" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><circle cx="712" cy="260" r="15" fill="#2563eb"/><circle cx="812" cy="260" r="15" fill="#ef4444"/><text x="762" y="296" text-anchor="middle" class="small">全景：空间与关系</text><rect x="665" y="328" width="195" height="88" rx="9" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><circle cx="762" cy="365" r="24" fill="#2563eb"/><text x="762" y="404" text-anchor="middle" class="small">近景：人物与反应</text><rect x="665" y="436" width="195" height="88" rx="9" fill="#fffbeb" stroke="#d97706" stroke-width="2"/><path d="M720 486 l42-25 40 25" fill="none" stroke="#d97706" stroke-width="8"/><text x="762" y="512" text-anchor="middle" class="small">特写：关节与结果</text><text x="664" y="565" class="small">受限时，先保这三层信息。</text></g>
  <line x1="893" y1="380" x2="918" y2="380" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <g><rect x="930" y="145" width="210" height="470" rx="18" class="panel"/><text x="954" y="183" class="pt">④ 冲击手段</text><path d="M965 260 Q1030 205 1100 260" fill="none" stroke="#10b981" stroke-width="5" marker-end="url(#a)"/><text x="1035" y="300" text-anchor="middle" class="body">推 · 跟 · 绕 · 摇</text><path d="M970 350 h125M985 370h95M1000 390h65" stroke="#ef4444" stroke-width="5"/><text x="1035" y="430" text-anchor="middle" class="body">速度参照</text><path d="M980 480 q18-35 36 0t36 0t36 0" fill="none" stroke="#7c3aed" stroke-width="5"/><text x="1035" y="535" text-anchor="middle" class="body">声音重音</text><text x="1035" y="575" text-anchor="middle" class="small">强化同一动作重点</text></g>
  <rect x="60" y="650" width="1080" height="93" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="88" y="688" class="pt">⑤ 判断：看不懂时先回空间全景或初始位置；可读后再加速度、机位与声音。</text><text x="88" y="720" class="body">冲击力建立在人物、目标、方向和动作结果都清楚的基础上。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">影视时间：同一段落里的三只钟</title><desc id="desc">区分放映时间、叙事时间和心理时间，并展示等长、省略、扩展与重排如何改变三者关系。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><style>.title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:400 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.pt{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.body{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}</style></defs>
  <rect width="1200" height="800" fill="#f1f5f9"/><rect x="30" y="24" width="1140" height="752" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="76" class="title">影视时间：同一段落里的三只钟</text><text x="70" y="108" class="sub">先分清三种时间，再看剪辑怎样压缩、延展和重排</text>
  <rect x="60" y="140" width="1080" height="275" rx="18" class="panel"/><text x="86" y="178" class="pt">① 三种时间同时存在</text>
  <g transform="translate(245 285)"><circle r="72" fill="#eff6ff" stroke="#2563eb" stroke-width="4"/><line y2="-42" stroke="#2563eb" stroke-width="5"/><line x2="34" y2="18" stroke="#2563eb" stroke-width="5"/><circle r="7" fill="#2563eb"/><text y="105" text-anchor="middle" class="pt">放映时间</text><text y="134" text-anchor="middle" class="small">银幕实际占用多久</text></g>
  <g transform="translate(600 285)"><circle r="72" fill="#fffbeb" stroke="#d97706" stroke-width="4"/><path d="M-38 20 Q0-55 42 6" fill="none" stroke="#d97706" stroke-width="5" marker-end="url(#a)"/><text y="105" text-anchor="middle" class="pt">叙事时间</text><text y="134" text-anchor="middle" class="small">故事事件跨越多久</text></g>
  <g transform="translate(955 285)"><circle r="72" fill="#f5f3ff" stroke="#7c3aed" stroke-width="4"/><path d="M-42 18 Q0-28 42 18 Q0 62-42 18" fill="none" stroke="#7c3aed" stroke-width="4"/><circle r="13" fill="#7c3aed"/><text y="105" text-anchor="middle" class="pt">心理时间</text><text y="134" text-anchor="middle" class="small">观众主观感到快或慢</text></g>
  <rect x="60" y="445" width="1080" height="200" rx="18" class="panel"/><text x="86" y="483" class="pt">② 创作者重组它们</text>
  <line x1="145" y1="552" x2="1055" y2="552" stroke="#94a3b8" stroke-width="4" marker-end="url(#a)"/>
  <g><circle cx="190" cy="552" r="27" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="190" y="559" text-anchor="middle" class="body">等长</text><text x="190" y="610" text-anchor="middle" class="small">保留过程</text></g>
  <g><circle cx="425" cy="552" r="27" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="425" y="559" text-anchor="middle" class="body">省略</text><text x="425" y="610" text-anchor="middle" class="small">删过程，留可补全线索</text></g>
  <g><circle cx="680" cy="552" r="27" fill="#d1fae5" stroke="#10b981" stroke-width="3"/><text x="680" y="559" text-anchor="middle" class="body">扩展</text><text x="680" y="610" text-anchor="middle" class="small">放大关键瞬间</text></g>
  <g><circle cx="935" cy="552" r="27" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="935" y="559" text-anchor="middle" class="body">重排</text><text x="935" y="610" text-anchor="middle" class="small">回返、补足、多层嵌套</text></g>
  <rect x="60" y="675" width="1080" height="68" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="88" y="716" class="pt">③ 判断边界：时间技巧要改变信息、情绪或因果理解，并始终给出空间坐标。</text>
</svg>

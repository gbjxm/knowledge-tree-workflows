<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">固定画框内仍然有过程、纵深与节奏</title>
  <desc id="desc">固定摄像机和画框不变，人物通过入画、前中后景移动、视线转移与出画形成可剪辑的内部变化。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .subtitle{font:400 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .panel-title{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .label{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}
      .body{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}
      .small{font:400 15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <rect x="30" y="24" width="1140" height="752" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="78" class="title">摄影机不动，画面内部照样可以“讲完一个过程”</text>
  <text x="70" y="111" class="subtitle">同一稳定画框：看人物如何进入、穿过纵深、转移注意，再离开</text>

  <rect x="60" y="145" width="1080" height="455" rx="18" class="panel"/>
  <text x="88" y="187" class="panel-title">① 外部不动：机位、光轴、焦距保持；相对主要内容稳定</text>
  <rect x="88" y="218" width="94" height="62" rx="10" fill="#2563eb"/>
  <path d="M182 232 l34 -15 v64 l-34 -15z" fill="#2563eb"/>
  <line x1="135" y1="280" x2="116" y2="327" stroke="#0f172a" stroke-width="6"/>
  <line x1="135" y1="280" x2="154" y2="327" stroke="#0f172a" stroke-width="6"/>
  <text x="88" y="354" class="label">固定摄像机 C1</text>
  <line x1="218" y1="249" x2="310" y2="249" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="310" y="218" width="790" height="320" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="3"/>
  <text x="332" y="252" class="label">同一画框</text>
  <line x1="332" y1="459" x2="1078" y2="459" stroke="#94a3b8" stroke-width="2"/>
  <rect x="342" y="286" width="115" height="157" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2" opacity=".8"/>
  <text x="358" y="422" class="small">前景遮挡</text>
  <circle cx="517" cy="370" r="20" fill="#fde68a" stroke="#d97706" stroke-width="2"/>
  <line x1="517" y1="390" x2="517" y2="438" stroke="#d97706" stroke-width="8"/>
  <line x1="517" y1="404" x2="488" y2="424" stroke="#d97706" stroke-width="6"/>
  <line x1="517" y1="404" x2="546" y2="424" stroke="#d97706" stroke-width="6"/>
  <path d="M466 382 C520 325 620 325 677 360" fill="none" stroke="#d97706" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <circle cx="704" cy="350" r="17" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
  <line x1="704" y1="367" x2="704" y2="414" stroke="#2563eb" stroke-width="7"/>
  <line x1="704" y1="382" x2="742" y2="351" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <circle cx="891" cy="326" r="30" fill="#ddd6fe" stroke="#7c3aed" stroke-width="2"/>
  <path d="M870 326 Q891 343 913 326" fill="none" stroke="#7c3aed" stroke-width="3"/>
  <text x="830" y="389" class="small">后景信息</text>
  <path d="M747 419 C829 458 962 448 1047 407" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="353" y="494" class="small">入画</text>
  <text x="522" y="494" class="small">前→中景</text>
  <text x="680" y="494" class="small">转身／视线触发</text>
  <text x="982" y="494" class="small">离开或出画</text>
  <text x="88" y="574" class="body">稳定画框提供观看基准；画内动作、遮挡、景深与视线变化提供过程和信息。</text>

  <rect x="60" y="625" width="250" height="91" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="82" y="659" class="label">过程</text><text x="82" y="687" class="body">有起点、变化、结尾</text>
  <rect x="329" y="625" width="250" height="91" rx="14" fill="#f0fdf4" stroke="#10b981" stroke-width="2"/>
  <text x="351" y="659" class="label">空间</text><text x="351" y="687" class="body">前、中、后景有关系</text>
  <rect x="598" y="625" width="250" height="91" rx="14" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="620" y="659" class="label">构图</text><text x="620" y="687" class="body">位置与主次传递信息</text>
  <rect x="867" y="625" width="273" height="91" rx="14" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="889" y="659" class="label">衔接</text><text x="889" y="687" class="body">动作、视线、光线或因果</text>

  <text x="70" y="752" class="panel-title">判断边界：固定画框不等于静止内容；没有画内变化与前后逻辑，才会退化成“照片延长”。</text>
</svg>

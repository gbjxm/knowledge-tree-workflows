<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">视听节奏：多条变化轨共同形成重音</title><desc id="desc">内容与情绪、镜头内部变化、镜头外部剪辑和声音四条轨道通过规律与变奏共同形成节奏重音。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><style>.title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:400 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.pt{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.body{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}</style></defs>
  <rect width="1200" height="800" fill="#f1f5f9"/><rect x="30" y="24" width="1140" height="752" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="76" class="title">视听节奏：多条变化轨共同形成重音</text><text x="70" y="108" class="sub">节奏不是持续加速，而是内容、画面、剪辑与声音的规律变化和变奏</text>
  <rect x="60" y="140" width="1080" height="475" rx="18" class="panel"/><text x="86" y="180" class="pt">① 沿时间读取四条轨道</text>
  <line x1="250" y1="205" x2="1080" y2="205" stroke="#94a3b8" stroke-width="3" marker-end="url(#a)"/><text x="1090" y="211" class="small">时间</text>
  <g><text x="86" y="264" class="body">内容与情绪</text><line x1="250" y1="258" x2="1080" y2="258" stroke="#e2e8f0" stroke-width="2"/><rect x="275" y="236" width="150" height="44" rx="8" fill="#dbeafe"/><rect x="455" y="228" width="210" height="52" rx="8" fill="#93c5fd"/><rect x="695" y="214" width="170" height="66" rx="8" fill="#2563eb"/><rect x="895" y="238" width="145" height="42" rx="8" fill="#bfdbfe"/><text x="350" y="265" text-anchor="middle" class="small">铺垫</text><text x="560" y="260" text-anchor="middle" class="small">信息增加</text><text x="780" y="254" text-anchor="middle" class="small" fill="#fff">转折</text><text x="968" y="265" text-anchor="middle" class="small">余波</text></g>
  <g><text x="86" y="354" class="body">镜头内部</text><line x1="250" y1="348" x2="1080" y2="348" stroke="#e2e8f0" stroke-width="2"/><path d="M275 365 Q360 300 445 350 T615 330 T780 290 T1035 348" fill="none" stroke="#10b981" stroke-width="5"/><text x="275" y="392" class="small">人物 / 机位 / 光影 / 色彩变化</text></g>
  <g><text x="86" y="444" class="body">镜头之间</text><line x1="250" y1="438" x2="1080" y2="438" stroke="#e2e8f0" stroke-width="2"/><rect x="275" y="416" width="155" height="44" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><rect x="440" y="416" width="105" height="44" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><rect x="555" y="416" width="72" height="44" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><rect x="637" y="416" width="60" height="44" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><rect x="707" y="416" width="48" height="44" fill="#7c3aed"/><rect x="765" y="416" width="48" height="44" fill="#7c3aed"/><rect x="823" y="416" width="90" height="44" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><rect x="923" y="416" width="112" height="44" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/><text x="275" y="491" class="small">镜头时长、景别与剪辑组织</text></g>
  <g><text x="86" y="534" class="body">声音</text><line x1="250" y1="528" x2="1080" y2="528" stroke="#e2e8f0" stroke-width="2"/><path d="M275 528 q18-25 36 0t36 0t36 0t36 0 q18-45 36 0t36 0t36 0t36 0t36 0 q18-65 36 0t36 0t36 0t36 0t36 0 q18-20 36 0t36 0" fill="none" stroke="#d97706" stroke-width="5"/><text x="275" y="572" class="small">速度、密度、强弱与音乐方向可同向，也可反向拉扯</text></g>
  <line x1="865" y1="205" x2="865" y2="582" stroke="#ef4444" stroke-width="4" stroke-dasharray="8 6"/><rect x="809" y="171" width="112" height="38" rx="19" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/><text x="865" y="197" text-anchor="middle" class="body">重音 / 变奏</text>
  <rect x="60" y="645" width="1080" height="98" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="88" y="682" class="pt">② 诊断顺序：先找哪条轨道缺少变化，再决定改内容、动作、时长、剪辑或声音。</text><text x="88" y="716" class="body">快切若没有新信息只是表面速度；长镜头内部有变化，同样可以形成强节奏。</text>
</svg>

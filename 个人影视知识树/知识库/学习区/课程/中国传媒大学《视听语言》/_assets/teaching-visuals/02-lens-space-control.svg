<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">镜头空间控制：四个变量各管什么</title>
  <desc id="desc">用四个对应面板区分机位距离、焦距、光圈和对焦点对空间、画面范围、通光与清晰范围的不同作用。</desc>
  <defs>
    <marker id="arrowB" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><marker id="arrowA" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#d97706"/></marker>
    <style>.title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.subtitle{font:400 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.panel-title{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.body{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.key{font:700 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#1d4ed8}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{stroke:#2563eb;stroke-width:3;fill:none}.amber{stroke:#d97706;stroke-width:3;fill:none}.guide{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;fill:none}</style>
  </defs>
  <rect width="1200" height="820" fill="#f1f5f9"/><rect x="30" y="24" width="1140" height="772" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="78" class="title">镜头空间控制：四个变量各管什么</text><text x="70" y="110" class="subtitle">先认“主要改变”，再检查伴随代价；不要把变焦、走近、开光圈和改焦点当成同一件事。</text>

  <rect x="60" y="145" width="525" height="245" rx="18" class="panel"/><circle cx="92" cy="178" r="18" fill="#dbeafe"/><text x="86" y="185" class="key">1</text><text x="120" y="185" class="panel-title">机位距离：改变相机与场景的几何关系</text>
  <g transform="translate(88 178)"><rect x="0" y="45" width="44" height="30" rx="5" fill="#2563eb"/><path d="M44 51 l18 9-18 9z" fill="#2563eb"/><circle cx="190" cy="55" r="18" fill="#d97706"/><rect x="178" y="73" width="24" height="50" rx="8" fill="#d97706"/><rect x="360" y="35" width="70" height="90" rx="8" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><path d="M65 60 h92" class="blue" marker-end="url(#arrowB)"/><path d="M88 104 h68" class="guide"/><text x="0" y="144" class="small">走近／后退</text><text x="152" y="144" class="small">主体</text><text x="354" y="144" class="small">背景</text></g>
  <rect x="88" y="335" width="469" height="42" rx="10" fill="#eff6ff"/><text x="104" y="362" class="key">主要改变：透视关系、相对尺度与距离条件</text>

  <rect x="615" y="145" width="525" height="245" rx="18" class="panel"/><circle cx="647" cy="178" r="18" fill="#dbeafe"/><text x="641" y="185" class="key">2</text><text x="675" y="185" class="panel-title">焦距：改变视角范围与影像大小</text>
  <g transform="translate(650 220)"><rect x="0" y="40" width="46" height="32" rx="5" fill="#2563eb"/><path d="M46 46 l18 10-18 10z" fill="#2563eb"/><path d="M65 56 L250 10 M65 56 L250 102" stroke="#10b981" stroke-width="3" fill="none"/><path d="M65 56 L250 35 M65 56 L250 77" class="amber"/><rect x="275" y="5" width="170" height="100" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><rect x="290" y="18" width="140" height="75" rx="5" fill="#ecfdf5"/><rect x="335" y="34" width="50" height="44" rx="4" fill="#fff7ed"/></g>
  <text x="665" y="326" class="small" fill="#047857">绿线：宽视角</text><text x="795" y="326" class="small" fill="#b45309">橙线：窄视角</text><rect x="643" y="335" width="469" height="42" rx="10" fill="#eff6ff"/><text x="659" y="362" class="key">主要改变：视角范围与影像大小；同时影响景深</text>

  <rect x="60" y="415" width="525" height="245" rx="18" class="panel"/><circle cx="92" cy="448" r="18" fill="#dbeafe"/><text x="86" y="455" class="key">3</text><text x="120" y="455" class="panel-title">光圈：改变通光孔与清晰范围</text>
  <g transform="translate(98 447)"><circle cx="72" cy="62" r="52" fill="#0f172a"/><circle cx="72" cy="62" r="27" fill="#fff" stroke="#d97706" stroke-width="4"/><circle cx="258" cy="62" r="52" fill="#0f172a"/><circle cx="258" cy="62" r="10" fill="#fff" stroke="#10b981" stroke-width="4"/><rect x="350" y="24" width="100" height="76" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><rect x="364" y="38" width="26" height="48" rx="5" fill="#dbeafe"/><rect x="395" y="38" width="42" height="48" rx="5" fill="#dcfce7"/><text x="32" y="138" class="small">孔更大：光更多</text><text x="210" y="138" class="small">孔更小：光更少</text></g>
  <rect x="88" y="610" width="469" height="42" rx="10" fill="#eff6ff"/><text x="104" y="637" class="key">主要改变：通光量；伴随改变景深</text>

  <rect x="615" y="415" width="525" height="245" rx="18" class="panel"/><circle cx="647" cy="448" r="18" fill="#dbeafe"/><text x="641" y="455" class="key">4</text><text x="675" y="455" class="panel-title">对焦点：把清晰中心放到哪里</text>
  <g transform="translate(650 445)"><circle cx="75" cy="58" r="22" fill="#cbd5e1"/><circle cx="220" cy="58" r="22" fill="#2563eb"/><circle cx="365" cy="58" r="22" fill="#cbd5e1"/><rect x="171" y="20" width="98" height="76" rx="8" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M130 110 h180" stroke="#10b981" stroke-width="10" stroke-linecap="round"/><path d="M40 110 h80 M320 110 h80" stroke="#cbd5e1" stroke-width="10" stroke-linecap="round"/><text x="40" y="148" class="small">前方</text><text x="198" y="148" class="small">对焦主体</text><text x="350" y="148" class="small">后方</text></g>
  <rect x="643" y="610" width="469" height="42" rx="10" fill="#eff6ff"/><text x="659" y="637" class="key">主要改变：可接受清晰范围的落点</text>

  <rect x="60" y="690" width="1080" height="68" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="88" y="731" class="panel-title">判断口诀：机位管几何，焦距管视角，光圈管通光与景深，对焦点管“清楚落在哪里”。</text>
</svg>

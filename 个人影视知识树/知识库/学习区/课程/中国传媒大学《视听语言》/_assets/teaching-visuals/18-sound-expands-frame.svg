<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">声音怎样越过画框</title><desc id="desc">声音从画内可见声源出发，可把注意引向画外空间，也可提前进入或延续到另一镜头，形成声音桥。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><style>.title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:400 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.pt{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.body{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.wave{fill:none;stroke:#7c3aed;stroke-width:5}</style></defs>
  <rect width="1200" height="800" fill="#f1f5f9"/><rect x="30" y="24" width="1140" height="752" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="76" class="title">声音怎样越过画框</text><text x="70" y="108" class="sub">看声源是否可见、听觉属于谁、声音何时进入或退出</text>
  <rect x="60" y="140" width="335" height="470" rx="18" class="panel"/><text x="86" y="180" class="pt">① 画内：声源可见</text>
  <rect x="90" y="225" width="275" height="245" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="4"/><circle cx="175" cy="330" r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M150 420 Q175 355 200 420" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><rect x="260" y="315" width="42" height="52" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><path d="M310 330 q18-22 36 0M310 352q25-32 50 0" fill="none" stroke="#7c3aed" stroke-width="4"/><text x="228" y="505" text-anchor="middle" class="body">观众看见“谁 / 什么在响”</text><text x="86" y="550" class="small">可建立动作、环境与现实空间。</text>
  <line x1="403" y1="375" x2="433" y2="375" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <rect x="445" y="140" width="335" height="470" rx="18" class="panel"/><text x="471" y="180" class="pt">② 画外：空间被扩展</text>
  <rect x="475" y="225" width="220" height="245" rx="10" fill="#f8fafc" stroke="#2563eb" stroke-width="4"/><circle cx="555" cy="330" r="34" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M530 420 Q555 355 580 420" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><path d="M705 320 q24-30 48 0M705 350q32-40 64 0M705 382q38-48 76 0" class="wave"/><text x="742" y="427" text-anchor="middle" class="small">声源在框外</text><path d="M570 322 L682 340" stroke="#ef4444" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#a)"/><text x="612" y="505" text-anchor="middle" class="body">未见其人，先感到方向与距离</text><text x="471" y="550" class="small">声源延迟揭示还可制造悬念。</text>
  <line x1="788" y1="375" x2="818" y2="375" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <rect x="830" y="140" width="310" height="470" rx="18" class="panel"/><text x="856" y="180" class="pt">③ 跨镜头：声音桥</text>
  <rect x="858" y="225" width="112" height="180" rx="9" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><text x="914" y="250" text-anchor="middle" class="small">镜头 A</text><circle cx="914" cy="320" r="28" fill="#2563eb"/>
  <rect x="1000" y="225" width="112" height="180" rx="9" fill="#fef3c7" stroke="#d97706" stroke-width="3"/><text x="1056" y="250" text-anchor="middle" class="small">镜头 B</text><rect x="1028" y="292" width="56" height="56" fill="#d97706"/>
  <path d="M870 448 q18-26 36 0t36 0t36 0t36 0t36 0t36 0" class="wave" marker-end="url(#a)"/><text x="985" y="495" text-anchor="middle" class="body">提前进入 / 跨切延续</text><text x="856" y="535" class="small">连接时空，或让主观听觉侵入现实。</text>
  <rect x="60" y="645" width="1080" height="98" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="88" y="682" class="pt">④ 声音不是画面的附属：它能让观众“听见框外”，并把两个镜头组织成一段。</text><text x="88" y="716" class="body">每条声音至少标注：类别、声源、视角、主要任务。</text>
</svg>

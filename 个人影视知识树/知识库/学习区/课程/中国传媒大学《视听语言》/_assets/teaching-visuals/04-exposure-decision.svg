<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">曝光决策：亮度相近，画面代价不同</title>
  <desc id="desc">分别展示光圈、快门和感光度在改变可用曝光时，同时留下景深、运动形态和噪点细节方面的不同结果，并给出按创作优先级决策的顺序。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><style>.title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.subtitle{font:400 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.panel-title{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.body{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.key{font:700 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.blue{stroke:#2563eb;stroke-width:3;fill:none}.amber{stroke:#d97706;stroke-width:3;fill:none}</style></defs>
  <rect width="1200" height="820" fill="#f1f5f9"/><rect x="30" y="24" width="1140" height="772" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="70" y="78" class="title">曝光决策：亮度相近，画面代价不同</text><text x="70" y="110" class="subtitle">三项都能提供曝光余量，但分别把结果写进景深、运动和画质；先定创作目标，再补足亮度。</text>

  <rect x="60" y="145" width="330" height="430" rx="18" class="panel"/><circle cx="92" cy="180" r="18" fill="#dbeafe"/><text x="86" y="187" class="key" fill="#1d4ed8">1</text><text x="122" y="187" class="panel-title">光圈：通光量 ↔ 景深</text>
  <circle cx="165" cy="275" r="58" fill="#0f172a"/><circle cx="165" cy="275" r="30" fill="#fff" stroke="#d97706" stroke-width="4"/><path d="M238 275 h90" class="blue" marker-end="url(#arrow)"/>
  <rect x="280" y="220" width="72" height="110" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="2"/><rect x="291" y="234" width="50" height="82" rx="4" fill="#e2e8f0"/><circle cx="316" cy="275" r="14" fill="#2563eb"/><path d="M293 302 h46" stroke="#d97706" stroke-width="5"/>
  <text x="92" y="372" class="body">开合通光孔，会同步改变</text><text x="92" y="400" class="body">前后可接受清晰范围。</text><rect x="88" y="436" width="274" height="92" rx="12" fill="#eff6ff"/><text x="104" y="469" class="key" fill="#1d4ed8">适合先定：虚实与空间信息</text><text x="104" y="500" class="small">再用快门或感光度补足曝光</text>

  <rect x="435" y="145" width="330" height="430" rx="18" class="panel"/><circle cx="467" cy="180" r="18" fill="#fef3c7"/><text x="461" y="187" class="key" fill="#b45309">2</text><text x="497" y="187" class="panel-title">快门：受光时间 ↔ 运动</text>
  <path d="M473 275 h245" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 7"/><circle cx="560" cy="275" r="24" fill="#d97706"/><circle cx="585" cy="275" r="24" fill="#d97706" opacity=".55"/><circle cx="610" cy="275" r="24" fill="#d97706" opacity=".25"/><path d="M470 335 h92" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/><path d="M590 335 h136" stroke="#2563eb" stroke-width="10" stroke-linecap="round"/>
  <text x="461" y="372" class="body">时间窗口越短越偏向凝固，</text><text x="461" y="400" class="body">越长越容易留下轨迹。</text><rect x="463" y="436" width="274" height="92" rx="12" fill="#fff7ed"/><text x="479" y="469" class="key" fill="#b45309">适合先定：动作清晰或拖影</text><text x="479" y="500" class="small">再用光圈或感光度补足曝光</text>

  <rect x="810" y="145" width="330" height="430" rx="18" class="panel"/><circle cx="842" cy="180" r="18" fill="#ede9fe"/><text x="836" y="187" class="key" fill="#6d28d9">3</text><text x="872" y="187" class="panel-title">感光度：可拍性 ↔ 画质</text>
  <rect x="850" y="222" width="110" height="110" rx="10" fill="#e0f2fe" stroke="#2563eb" stroke-width="2"/><path d="M865 315 l20-35 18 18 17-29 25 46z" fill="#10b981"/><circle cx="932" cy="248" r="10" fill="#fbbf24"/>
  <rect x="990" y="222" width="110" height="110" rx="10" fill="#e0f2fe" stroke="#7c3aed" stroke-width="2"/><path d="M1005 315 l20-35 18 18 17-29 25 46z" fill="#10b981" opacity=".75"/>
  <g fill="#7c3aed"><circle cx="1008" cy="240" r="3"/><circle cx="1028" cy="258" r="3"/><circle cx="1050" cy="238" r="3"/><circle cx="1073" cy="270" r="3"/><circle cx="1090" cy="248" r="3"/><circle cx="1018" cy="306" r="3"/><circle cx="1068" cy="310" r="3"/></g>
  <text x="850" y="360" class="small">较低：细节更稳</text><text x="990" y="360" class="small">提高：暗处更可拍</text><text x="836" y="394" class="body">提高敏感度可换取余量，</text><text x="836" y="422" class="body">通常伴随噪点与细节损失。</text><rect x="838" y="450" width="274" height="78" rx="12" fill="#f5f3ff"/><text x="854" y="481" class="key" fill="#6d28d9">适合先定：可接受画质底线</text><text x="854" y="507" class="small">使用满足拍摄的最低充分值</text>

  <rect x="60" y="605" width="1080" height="148" rx="18" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="88" y="643" class="panel-title">现场决策链：目标优先，不是参数平均分配</text>
  <rect x="88" y="669" width="235" height="48" rx="12" fill="#fff" stroke="#10b981" stroke-width="2"/><text x="111" y="700" class="body">① 先定不能牺牲的效果</text><path d="M333 693 h70" class="blue" marker-end="url(#arrow)"/><rect x="415" y="669" width="254" height="48" rx="12" fill="#fff" stroke="#10b981" stroke-width="2"/><text x="438" y="700" class="body">② 再用另外两项补曝光</text><path d="M679 693 h70" class="blue" marker-end="url(#arrow)"/><rect x="761" y="669" width="351" height="48" rx="12" fill="#fff" stroke="#10b981" stroke-width="2"/><text x="784" y="700" class="body">③ 最后查亮暗细节、景深、运动与噪点</text><text x="88" y="742" class="small">风格化偏离可以成立，但要说清舍弃了哪些信息、换来了什么表达。</text>
</svg>

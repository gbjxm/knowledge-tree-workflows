<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">影调层次：分开主体与空间，不要灰成一片</title><desc id="desc">比较层次混在一起与亮度分离后的画面，并区分整体明暗面积和反差过渡两个影调维度。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker><style>.title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.sub{font:400 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.pt{font:700 21px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#0f172a}.body{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#334155}.small{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#475569}.light{font:400 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}</style></defs>
  <rect width="1200" height="800" fill="#f1f5f9"/><rect x="30" y="24" width="1140" height="752" rx="24" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="76" class="title">影调层次：分开主体与空间，不要灰成一片</text><text x="70" y="108" class="sub">先看前、中、后景能否分辨，再分别判断整体明暗与反差过渡</text>
  <rect x="60" y="140" width="500" height="370" rx="18" class="panel"/><text x="86" y="180" class="pt">① 层次混合：重点不清</text>
  <rect x="90" y="215" width="440" height="220" rx="10" fill="#94a3b8"/><path d="M90 365 Q190 295 285 365 T530 345 V435 H90Z" fill="#9aa7b6"/><circle cx="300" cy="300" r="42" fill="#9ca3af" stroke="#94a3b8" stroke-width="3"/><path d="M235 415 Q300 335 365 415" fill="#9ca3af"/><rect x="120" y="265" width="76" height="170" fill="#9aa7b6"/><text x="310" y="470" text-anchor="middle" class="body">主体、前景、背景亮度接近</text>
  <line x1="570" y1="325" x2="610" y2="325" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <rect x="620" y="140" width="520" height="370" rx="18" class="panel"/><text x="646" y="180" class="pt">② 层次分离：主体跳出</text>
  <rect x="650" y="215" width="460" height="220" rx="10" fill="#334155"/><path d="M650 365 Q750 300 845 365 T1110 345 V435 H650Z" fill="#64748b"/><rect x="680" y="265" width="78" height="170" fill="#0f172a"/><circle cx="875" cy="295" r="44" fill="#e2e8f0" stroke="#fff" stroke-width="3"/><path d="M805 415 Q875 330 945 415" fill="#cbd5e1"/><text x="720" y="248" text-anchor="middle" class="light">前景：深</text><text x="875" y="248" text-anchor="middle" class="light">主体：亮</text><text x="1045" y="248" text-anchor="middle" class="light">背景：中</text><text x="880" y="470" text-anchor="middle" class="body">相邻层有差异，视觉中心明确</text>
  <rect x="60" y="540" width="1080" height="105" rx="18" class="panel"/><text x="86" y="578" class="pt">③ 两个维度必须分开判断</text>
  <line x1="310" y1="609" x2="500" y2="609" stroke="#2563eb" stroke-width="6" marker-end="url(#a)"/><text x="275" y="616" text-anchor="end" class="body">低调</text><text x="525" y="616" class="body">高调</text><text x="405" y="637" text-anchor="middle" class="small">整体明暗面积</text>
  <line x1="735" y1="609" x2="925" y2="609" stroke="#d97706" stroke-width="6" marker-end="url(#a)"/><text x="700" y="616" text-anchor="end" class="body">软调</text><text x="950" y="616" class="body">硬调</text><text x="830" y="637" text-anchor="middle" class="small">反差与过渡</text>
  <rect x="60" y="675" width="1080" height="68" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="88" y="716" class="pt">④ 高调不等于过曝，低调不等于死黑；目标始终是保留可读层次与叙事重点。</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">故事前提可行性门</title>
  <desc id="desc">从一句话点子依次检查独特性、欲望线、主要对手和结构终点，决定继续开发、调整体量与类型或暂存素材。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker>
    <style>
      .title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#111827}.sub{font:400 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#4b5563}.pt{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#111827}.body{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#374151}.small{font:400 15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#4b5563}.num{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#fff}.tag{font:700 16px "Microsoft YaHei","Noto Sans CJK SC",sans-serif}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.flow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="820" fill="#eef2f7"/>
  <rect x="30" y="24" width="1140" height="772" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="78" class="title">故事前提可行性门</text>
  <text x="70" y="112" class="sub">读法：一句话点子依次过四道门；任何一门空缺，都先在低成本阶段修正。</text>

  <rect x="70" y="145" width="1060" height="86" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="98" y="181" class="pt">输入：一句话故事</text>
  <text x="98" y="211" class="body">写清“谁 → 想得到什么 → 谁／什么阻挡 → 可能走向什么结果”，不要先用设定细节填满页面。</text>

  <path d="M600 232 V267" class="flow"/>
  <rect x="70" y="275" width="245" height="244" rx="18" class="card"/>
  <circle cx="106" cy="314" r="22" fill="#2563eb"/><text x="99" y="322" class="num">1</text>
  <text x="140" y="321" class="pt">独特性</text>
  <text x="96" y="365" class="body">只有这个点子能提供</text>
  <text x="96" y="393" class="body">的“黄金”是什么？</text>
  <line x1="96" y1="421" x2="289" y2="421" stroke="#e2e8f0" stroke-width="2"/>
  <text x="96" y="455" class="small">警报：只是在拼接</text>
  <text x="96" y="478" class="small">近期看过的两部作品</text>

  <path d="M315 397 H347" class="flow"/>
  <rect x="355" y="275" width="245" height="244" rx="18" class="card"/>
  <circle cx="391" cy="314" r="22" fill="#2563eb"/><text x="384" y="322" class="num">2</text>
  <text x="425" y="321" class="pt">欲望线</text>
  <text x="381" y="365" class="body">外部目标能否持续</text>
  <text x="381" y="393" class="body">推动目标篇幅？</text>
  <line x1="381" y1="421" x2="574" y2="421" stroke="#e2e8f0" stroke-width="2"/>
  <text x="381" y="455" class="small">警报：只够一个场景，</text>
  <text x="381" y="478" class="small">中段没有行动脊柱</text>

  <path d="M600 397 H632" class="flow"/>
  <rect x="640" y="275" width="245" height="244" rx="18" class="card"/>
  <circle cx="676" cy="314" r="22" fill="#2563eb"/><text x="669" y="322" class="num">3</text>
  <text x="710" y="321" class="pt">主要对手</text>
  <text x="666" y="365" class="body">能否持续阻挡目标、</text>
  <text x="666" y="393" class="body">升级冲突并逼迫学习？</text>
  <line x1="666" y1="421" x2="859" y2="421" stroke="#e2e8f0" stroke-width="2"/>
  <text x="666" y="455" class="small">警报：只有零散麻烦，</text>
  <text x="666" y="478" class="small">没有持续作用力</text>

  <path d="M885 397 H917" class="flow"/>
  <rect x="925" y="275" width="205" height="244" rx="18" class="card"/>
  <circle cx="961" cy="314" r="22" fill="#2563eb"/><text x="954" y="322" class="num">4</text>
  <text x="995" y="321" class="pt">结构终点</text>
  <text x="951" y="365" class="body">最终的领悟、行动</text>
  <text x="951" y="393" class="body">或新状态是什么？</text>
  <line x1="951" y1="421" x2="1104" y2="421" stroke="#e2e8f0" stroke-width="2"/>
  <text x="951" y="455" class="small">不是锁死结尾，</text>
  <text x="951" y="478" class="small">而是给结构一个方向</text>

  <path d="M600 520 V555" class="flow"/>
  <rect x="70" y="565" width="510" height="128" rx="18" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <text x="98" y="605" class="pt" fill="#166534">四项成立：进入下一轮开发</text>
  <text x="98" y="638" class="body">再检查类型是否放大点子，随后发展人物、结构和场景。</text>
  <text x="98" y="667" class="small">通过只代表“值得继续”，不代表故事已经成功。</text>
  <rect x="620" y="565" width="510" height="128" rx="18" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
  <text x="648" y="605" class="pt" fill="#9f1239">任一空缺：先不要堆正文</text>
  <text x="648" y="638" class="body">可重做人物／对手、更换类型、缩短体量，或暂存为素材。</text>
  <text x="648" y="667" class="small">这叫降低返工成本，不叫否定灵感。</text>

  <rect x="70" y="725" width="1060" height="48" rx="14" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="96" y="756" class="tag" fill="#1d4ed8">教学边界：这是特鲁比访谈启发的开发检查，不是票房预测器，也不是替代创作判断的公式。</text>
</svg>

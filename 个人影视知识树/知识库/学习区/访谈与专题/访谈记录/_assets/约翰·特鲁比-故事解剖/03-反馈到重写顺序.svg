<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">从观众反馈到结构重写</title>
  <desc id="desc">观众先报告体验症状，作者定位共同区段并诊断结构根因，再按从前提到对白的依赖顺序重写和复测。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#2563eb"/></marker>
    <style>.title{font:700 34px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#111827}.sub{font:400 18px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#4b5563}.pt{font:700 22px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#111827}.body{font:400 17px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#374151}.small{font:400 15px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#4b5563}.num{font:700 20px "Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#fff}.card{fill:#fff;stroke:#cbd5e1;stroke-width:2}.flow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="860" fill="#eef2f7"/><rect x="30" y="24" width="1140" height="812" rx="26" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="70" y="78" class="title">从观众反馈到结构重写</text>
  <text x="70" y="112" class="sub">观众擅长报告“哪里不奏效”；作者负责判断“为什么”和“怎么改”。</text>

  <rect x="70" y="150" width="250" height="165" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <circle cx="105" cy="187" r="20" fill="#f97316"/><text x="99" y="194" class="num">1</text>
  <text x="140" y="194" class="pt">记录症状</text>
  <text x="96" y="235" class="body">“这里慢”</text><text x="96" y="264" class="body">“看不懂”</text><text x="96" y="293" class="body">“不想跟这个人物”</text>
  <path d="M320 232 H365" class="flow"/>

  <rect x="375" y="150" width="250" height="165" rx="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <circle cx="410" cy="187" r="20" fill="#2563eb"/><text x="404" y="194" class="num">2</text>
  <text x="445" y="194" class="pt">定位共识</text>
  <text x="401" y="235" class="body">哪些读者在同一处</text><text x="401" y="264" class="body">失去兴趣或信任？</text><text x="401" y="293" class="small">先找区段，不争辩意图</text>
  <path d="M625 232 H670" class="flow"/>

  <rect x="680" y="150" width="250" height="165" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="715" cy="187" r="20" fill="#7c3aed"/><text x="709" y="194" class="num">3</text>
  <text x="750" y="194" class="pt">诊断根因</text>
  <text x="706" y="235" class="body">欲望线？人物建立？</text><text x="706" y="264" class="body">场序？重复？风险？</text><text x="706" y="293" class="small">作者判断，不照抄处方</text>
  <path d="M930 232 H975" class="flow"/>

  <rect x="985" y="150" width="145" height="165" rx="18" fill="#ecfdf5" stroke="#22c55e" stroke-width="2"/>
  <circle cx="1020" cy="187" r="20" fill="#16a34a"/><text x="1014" y="194" class="num">4</text>
  <text x="1055" y="194" class="pt">复测</text>
  <text x="1011" y="240" class="body">体验是否</text><text x="1011" y="269" class="body">真的改善？</text>

  <path d="M600 325 V360" class="flow"/>
  <text x="70" y="402" class="pt">重写顺序：先修依赖上游，最后才碰表层文字</text>

  <rect x="70" y="430" width="1060" height="235" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <rect x="96" y="461" width="138" height="70" rx="14" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="129" y="491" class="pt">前提</text><text x="118" y="518" class="small">值得写吗？</text>
  <path d="M234 496 H270" class="flow"/>
  <rect x="278" y="461" width="138" height="70" rx="14" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="314" y="491" class="pt">人物</text><text x="296" y="518" class="small">弱点与目标</text>
  <path d="M416 496 H452" class="flow"/>
  <rect x="460" y="461" width="138" height="70" rx="14" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="486" y="491" class="pt">欲望／对手</text><text x="483" y="518" class="small">全篇动力</text>
  <path d="M598 496 H634" class="flow"/>
  <rect x="642" y="461" width="138" height="70" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="678" y="491" class="pt">终点</text><text x="665" y="518" class="small">变化方向</text>
  <path d="M780 496 H816" class="flow"/>
  <rect x="824" y="461" width="138" height="70" rx="14" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="849" y="491" class="pt">场景序列</text><text x="850" y="518" class="small">整体推进</text>
  <path d="M962 496 H998" class="flow"/>
  <rect x="1006" y="461" width="98" height="70" rx="14" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="1037" y="491" class="pt">单场</text><text x="1026" y="518" class="small">功能节奏</text>

  <path d="M1055 532 V575 H810" class="flow"/>
  <rect x="642" y="573" width="168" height="66" rx="14" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="691" y="604" class="pt">对白</text><text x="672" y="630" class="small">最后精修表达</text>
  <text x="96" y="607" class="body">上游未成立时：</text>
  <text x="96" y="636" class="body">润色对白不会修好故事，只会让返工更昂贵。</text>

  <rect x="70" y="704" width="510" height="92" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="98" y="741" class="pt">完美主义卡住、还没有完整材料？</text>
  <text x="98" y="773" class="body">先完成一份可判断的稿，再诊断。</text>
  <rect x="620" y="704" width="510" height="92" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="648" y="741" class="pt">反复整稿后才发现同类结构问题？</text>
  <text x="648" y="773" class="body">把前提与场景序列检查前移。</text>
  <text x="70" y="825" class="small">边界：反馈受目标观众、样本与试映设计影响；“听观众”不等于把单个观众的解法当命令。</text>
</svg>
